    );
  });

  list.innerHTML=results.map((result,index)=>`
    <button class="area-index-item" type="button" data-area-index="${index}">
      <strong>${index+1}. ${esc(result.title)}</strong>
      ${esc(result.detail)}
    </button>
  `).join("");

  list.querySelectorAll("[data-area-index]").forEach(button=>{
    button.addEventListener("click",()=>{
      const result=regionIndexedResults[Number(button.dataset.areaIndex)];
      if(!result||!map)return;
      if(result.polygon){
        const bounds=polygonsBounds([result.polygon]);
        if(bounds)map.fitBounds(bounds.pad(.55),{maxZoom:19});
      }else{
        map.setView([result.lat,result.lng],18);
      }
    });
  });

  count.textContent=`${results.length} indexed`;
  panel.hidden=!results.length;
}
async function runBrushedAreaSearch(bounds){
  const token=++areaSearchToken;
  const known=COURTS.filter(c=>
    hasPoint(c)&&bounds.contains([Number(c.lat),Number(c.lng)])
  );

  detectionProgress(5,"Scanning the brushed satellite area…");

  const center=bounds.getCenter();
  const diagonal=haversineMeters(
    {lat:bounds.getSouth(),lng:bounds.getWest()},
    {lat:bounds.getNorth(),lng:bounds.getEast()}
  );
  const pseudo={
    id:`area-${Date.now()}`,
    name:"Selected area",
    category:"open",
    court_count:0,
    lat:center.lat,
    lng:center.lng
  };

  const scan=detectCourtPolygonsFromSatellite(
    pseudo,
    (percent,label)=>{
      if(token===areaSearchToken)detectionProgress(percent,label);
    },
    {
      bounds:boundsObjectFromLeaflet(bounds),
      radiusMeters:Math.max(500,diagonal/2),
      sourceSize:896,
      analysisSize:448,
      timeoutMs:4800,
      maxDistance:diagonal,
      distanceScale:Math.max(500,diagonal*.7),
      minComponentPixels:18,
      scoreThreshold:.57,
      referenceThreshold:.38,
      colorThemeThreshold:.55,
      ratioThreshold:.42,
      strictReference:true,
      candidateJoinDistance:130,
      minimumGroupScore:.48,
      returnAllGroups:true,
      maxGroups:16,
      maxCandidates:32
    }
  );

  const result=await Promise.race([
    scan.catch(()=>[]),
    new Promise(resolve=>window.setTimeout(()=>resolve([]),6200))
  ]);

  if(token!==areaSearchToken)return;

  const cachedPolygons=known.flatMap(court=>{
    const cached=readFootprintCache(court);
    return cached?.polygons||[];
  });
  const polygons=result.length?result:cachedPolygons;

  if(polygons.length){
    transitionToDetectedCourts(polygons);
    renderAreaIndex(polygons,known);
    detectionProgress(
      100,
      `${regionIndexedResults.length} court areas or facilities indexed.`,
      "complete"
    );
    hideDetectionProgress(800);
  }else{
    courtOutlineLayer?.clearLayers();
    renderAreaIndex([],known);
    detectionProgress(
      100,
      "No confident court outline found — showing known facility pins only.",
      "warning"
    );
    hideDetectionProgress(1500);
  }
}
async function locateMe(){
  const button=document.getElementById("locate");
  button.disabled=true;
  button.textContent="Locating…";

  try{
    const location=await requestUserLocation();
    map?.setView([location.lat,location.lng],12);
    document.getElementById("sort").value="distance";
    button.textContent="Located";
    applyFilters();
    showToast("Sorted by distance from your location.");
  }catch(_){
    button.textContent="Locate me";
    showToast("Your location could not be retrieved.");
  }finally{
    button.disabled=false;
  }
}
function showToast(message){
  const toast=document.getElementById("toast");
  toast.textContent=message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>toast.classList.remove("show"),1800);
}
function currentState(){
  return {
    q:document.getElementById("search").value.trim(),
    city:document.getElementById("city").value,
    lights:document.getElementById("lights").value,
    mapped:document.getElementById("mapped").value,
    sort:document.getElementById("sort").value,
    cluster:document.getElementById("clusterMode").value,
    categories:[...enabled].sort().join(","),
    shortlist:shortlistOnly?"1":""
  };
}
function updateUrl(push){
  const state=currentState();
  const params=new URLSearchParams();
  for(const [key,value] of Object.entries(state)){
    if(value)params.set(key,value);
  }
  const url=`${location.pathname}${params.toString()?`?${params}`:""}`;
  history[push?"pushState":"replaceState"](null,"",url);
}
async function shareView(){
  updateUrl(true);
  const url=location.href;
  try{
    await navigator.clipboard.writeText(url);
    showToast("Shareable view copied.");
  }catch(_){
    window.prompt("Copy this shareable URL:",url);
  }
}
function loadStateFromUrl(){
  const p=new URLSearchParams(location.search);
  document.getElementById("search").value=p.get("q")||"";
  document.getElementById("city").value=p.get("city")||"";
  document.getElementById("lights").value=p.get("lights")||"";
  document.getElementById("mapped").value=p.get("mapped")||"";
  document.getElementById("sort").value=p.get("sort")||"name";
  document.getElementById("clusterMode").value=p.get("cluster")||"category";

  const cats=p.get("categories");
  if(cats){
    enabled.clear();
    cats.split(",").filter(x=>["pay","open","club"].includes(x)).forEach(x=>enabled.add(x));
  }

  shortlistOnly=p.get("shortlist")==="1";
  document.getElementById("shortlistOnly").classList.toggle("active",shortlistOnly);
  document.querySelectorAll(".toggle").forEach(button=>{
    button.setAttribute("aria-pressed",String(enabled.has(button.dataset.category)));
  });
}
function resetView(){
  clearCourtFootprint();
  clearDiscoverySearch();
  enabled.clear();
  ["pay","open","club"].forEach(x=>enabled.add(x));
  shortlistOnly=false;

  document.getElementById("search").value="";
  document.getElementById("city").value="";
  document.getElementById("lights").value="";
  document.getElementById("mapped").value="";
  document.getElementById("sort").value="name";
  document.getElementById("clusterMode").value="category";
  document.getElementById("shortlistOnly").classList.remove("active");

  document.querySelectorAll(".toggle").forEach(button=>button.setAttribute("aria-pressed","true"));
  history.replaceState(null,"",location.pathname);
  applyFilters();
  fitVisible();
}
function populateCities(){
  const cities=[...new Set(COURTS.map(c=>c.city).filter(Boolean))].sort();
  const select=document.getElementById("city");
  for(const city of cities){
    const option=document.createElement("option");
    option.value=city;option.textContent=city;select.appendChild(option);
  }
}
function wireControls(){
  for(const id of ["search","city","lights","mapped","sort","clusterMode"]){
    const event=id==="search"?"input":"change";
    document.getElementById(id).addEventListener(event,applyFilters);
  }

  document.getElementById("fit").addEventListener("click",fitVisible);
  document.getElementById("locate").addEventListener("click",locateMe);
  document.getElementById("findNearMe").addEventListener("click",findCourtsNearMe);
  document.getElementById("brushArea").addEventListener("click",startAreaBrush);
  document.getElementById("clearDiscovery").addEventListener("click",()=>{
    clearDiscoverySearch();
    fitVisible();
  });
  document.getElementById("nearRadius").addEventListener("change",()=>{
    if(proximityRadiusMiles!==null)findCourtsNearMe();
  });
  document.getElementById("share").addEventListener("click",shareView);
  document.getElementById("reset").addEventListener("click",resetView);

  document.getElementById("shortlistOnly").addEventListener("click",()=>{
    shortlistOnly=!shortlistOnly;
    document.getElementById("shortlistOnly").classList.toggle("active",shortlistOnly);
    applyFilters();
  });

  document.querySelectorAll(".toggle").forEach(button=>{
    button.addEventListener("click",()=>{
      const category=button.dataset.category;
      if(enabled.has(category))enabled.delete(category);else enabled.add(category);
      button.setAttribute("aria-pressed",String(enabled.has(category)));
      applyFilters();
    });
  });

  window.addEventListener("popstate",()=>{
    loadStateFromUrl();
    applyFilters();
  });
}
function init(){
  hydrateSavedPoints();
  populateCities();
  wireControls();
  loadStateFromUrl();
  renderList();
  startMapApplication();

  // Render immediately, then place remaining address-based facilities
  // gradually without blocking search or map interaction.
  window.setTimeout(()=>{
    startBackgroundAddressMapping();
  },350);
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);
else init();
</script>
