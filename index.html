<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>LA Metro Tennis Court Finder</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://a.basemaps.cartocdn.com">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<style>
:root{
  --pay:#d55e00;--open:#1777a7;--club:#7b4ab5;
  --ink:#171717;--muted:#686868;--line:#dedede;--panel:#fff;--soft:#f5f5f5;--accent:#111;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
button,input,select{font:inherit}
body{background:#eee}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
.topbar{
  display:grid;grid-template-columns:auto minmax(220px,1fr) auto;gap:10px;align-items:center;
  padding:10px 12px;background:#111;color:#fff;z-index:1000;
}
.brand{font-size:17px;font-weight:850;white-space:nowrap}
.search{height:40px;border:1px solid #444;border-radius:10px;background:#252525;color:#fff;padding:0 12px;min-width:0}
.search::placeholder{color:#aaa}
.top-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.select,.ghost{
  height:40px;border:1px solid #444;border-radius:10px;background:#252525;color:#fff;padding:0 10px;
}
.ghost{cursor:pointer;font-weight:750}
.ghost:hover{background:#333}
.layout{min-height:0;display:grid;grid-template-columns:410px minmax(0,1fr)}
.sidebar{min-height:0;background:var(--panel);border-right:1px solid var(--line);display:grid;grid-template-rows:auto auto auto 1fr}
.controls{padding:10px 11px;border-bottom:1px solid var(--line);display:grid;gap:9px}
.control-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.toggles{display:flex;gap:7px;flex-wrap:wrap}
.toggle{
  border:1px solid #ccc;background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800;cursor:pointer;
  display:flex;gap:6px;align-items:center;
}
.toggle[aria-pressed="false"]{opacity:.42}
.swatch{width:10px;height:10px;border-radius:50%}
.filter-select{
  height:35px;border:1px solid #ccc;border-radius:8px;background:#fff;padding:0 8px;font-size:12px;min-width:120px;
}
.mini-button{
  height:35px;border:1px solid #ccc;border-radius:8px;background:#fff;padding:0 9px;font-size:12px;font-weight:800;cursor:pointer;
}
.mini-button.active{background:#111;color:#fff;border-color:#111}
.discovery-tools{
  border:1px solid #d6d6d6;
  border-radius:10px;
  background:#fafafa;
  padding:9px;
  display:grid;
  gap:7px;
}
.discovery-title{
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.04em;
}
.discovery-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.discovery-row .mini-button{flex:0 0 auto}
.radius-select{min-width:82px}
.discovery-status{font-size:10px;color:#666;line-height:1.35}
#map.brush-mode{cursor:crosshair}
.area-index-panel{
  padding:8px 10px;
  border-bottom:1px solid var(--line);
  background:#fbfbfb;
  max-height:190px;
  overflow:auto;
}
.area-index-panel[hidden]{display:none}
.area-index-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  margin-bottom:6px;
  font-size:11px;
  font-weight:900;
}
.area-index-list{display:grid;gap:5px}
.area-index-item{
  width:100%;
  border:1px solid #d4d4d4;
  border-radius:7px;
  background:#fff;
  padding:6px 8px;
  text-align:left;
  cursor:pointer;
  font-size:10px;
  line-height:1.3;
}
.area-index-item strong{display:block;font-size:11px}
.area-index-number{
  width:27px;height:27px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:#111;color:#fff;border:3px solid #fff;
  box-shadow:0 1px 7px rgba(0,0,0,.5);
  font-size:11px;font-weight:950;
}
.summary{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px}
.summary strong{color:var(--ink)}
#list{overflow:auto;padding:9px}
.card{
  --c:#777;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 10px 9px;margin-bottom:8px;background:#fff;
}
.card:hover{border-color:#bbb}
.card.unmapped{background:#fafafa}
.card.shortlisted{box-shadow:0 0 0 2px rgba(17,17,17,.13)}
.card h2{font-size:13px;line-height:1.25;margin:0 0 4px}
.address{font-size:11px;color:var(--muted);line-height:1.35}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:9px;font-weight:850;text-transform:uppercase;letter-spacing:.02em;border:1px solid #d1d1d1;border-radius:999px;padding:3px 6px;background:#fff}
.actions{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.actions button,.actions a{
  border:1px solid #cfcfcf;background:#fff;color:#111;text-decoration:none;border-radius:7px;padding:6px 8px;font-size:10px;font-weight:800;cursor:pointer;
}
.actions button.primary{background:#111;color:#fff;border-color:#111}
.actions button.saved{background:#f2e9ff;border-color:#c9a8ee}
.map-pane{min-width:0;min-height:0;position:relative}
#map{position:absolute;inset:0;background:#f4f4f2}
#map .leaflet-base-satellite-pane{
  filter:none;
  opacity:1;
}
#map .leaflet-area-color-pane{
  filter:saturate(1.34) contrast(1.14) brightness(1.03)!important;
  opacity:0;
  pointer-events:none;
  transition:opacity .42s ease;
}
#map .leaflet-court-color-pane{
  filter:saturate(1.95) contrast(1.42) brightness(1.05)!important;
  opacity:0;
  pointer-events:none;
  transition:opacity .42s ease;
}
#map .leaflet-tile{
  image-rendering:auto;
}
#map.court-footprint-active .court-dot{
  opacity:0;
}
#map.court-footprint-active .leaflet-marker-icon:hover .court-dot,
#map.court-footprint-active .leaflet-marker-icon:focus .court-dot{
  opacity:.7;
}
.loading-cover{
  position:absolute;inset:0;z-index:900;background:#efefef;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;
}
.loading-cover.hidden{display:none}
.loading-card{max-width:460px;background:#fff;border:1px solid #ccc;border-radius:14px;padding:20px;box-shadow:0 6px 25px rgba(0,0,0,.1)}
.loading-card h2{font-size:18px;margin:0 0 8px}
.loading-card p{font-size:13px;color:#666;line-height:1.45;margin:0}
.detection-progress{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:850;
  width:min(430px,calc(100% - 110px));
  padding:10px 12px;
  border:1px solid rgba(70,70,70,.24);
  border-radius:11px;
  background:rgba(255,255,255,.95);
  box-shadow:0 4px 18px rgba(0,0,0,.16);
  backdrop-filter:blur(5px);
  transition:opacity .25s ease,transform .25s ease;
}
.detection-progress[hidden]{display:none}
.detection-progress-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:7px;
  font-size:11px;
  font-weight:800;
}
.detection-progress-row span:first-child{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.detection-progress-percent{
  flex:0 0 auto;
  color:#555;
  font-variant-numeric:tabular-nums;
}
.detection-progress-track{
  height:7px;
  overflow:hidden;
  border-radius:999px;
  background:#e4e4e4;
}
.detection-progress-fill{
  width:0%;
  height:100%;
  border-radius:999px;
  background:#111;
  transition:width .38s ease;
}
.detection-progress.complete .detection-progress-fill{
  background:#277b4b;
}
.detection-progress.warning .detection-progress-fill{
  background:#9a6718;
}
.cache-queue-status{
  position:absolute;
  left:12px;
  bottom:24px;
  z-index:820;
  max-width:min(360px,calc(100% - 24px));
  padding:7px 10px;
  border:1px solid rgba(70,70,70,.22);
  border-radius:999px;
  background:rgba(255,255,255,.93);
  box-shadow:0 2px 10px rgba(0,0,0,.12);
  color:#444;
  font-size:10px;
  font-weight:800;
  backdrop-filter:blur(5px);
  transition:opacity .2s ease;
}
.cache-queue-status[hidden]{display:none}
@media(max-width:650px){
  .detection-progress{
    top:54px;
    width:calc(100% - 24px);
  }
}
.court-dot{
  width:14px;height:14px;border-radius:50%;border:2px solid white;
  box-shadow:0 1px 4px rgba(0,0,0,.45);
  transition:opacity .16s ease;
}
.cluster-bubble{
  width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:12px;font-weight:900;border:3px solid rgba(255,255,255,.95);box-shadow:0 1px 6px rgba(0,0,0,.4);
}
.cluster-shell{background:transparent!important;border:0!important}
.popup-title{font-size:14px;font-weight:850;margin-bottom:3px}
.popup-meta{font-size:11px;color:#555;line-height:1.4}
.popup-links{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.popup-links a{font-size:10px;font-weight:800;text-decoration:none;border:1px solid #ccc;border-radius:6px;padding:5px 7px;color:#111}
.popup-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;padding-top:8px;border-top:1px solid #e1e1e1}
.popup-tool{border:1px solid #bbb;border-radius:7px;background:#fff;padding:6px 8px;color:#222;font-size:10px;font-weight:850;cursor:pointer}
.popup-tool:hover{background:#f2f2f2}
.popup-tool.danger{border-color:#a76b6b;color:#7d2828}
.popup-tool.manual{border-color:#666}
.user-location{
  width:18px;height:18px;border-radius:50%;background:#111;border:4px solid #fff;box-shadow:0 1px 8px rgba(0,0,0,.45);
}
.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:2000;background:#111;color:#fff;
  border-radius:999px;padding:9px 14px;font-size:12px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
@media(max-width:960px){
  .topbar{grid-template-columns:1fr auto}.brand{grid-column:1/2}.search{grid-column:1/-1;grid-row:2}.top-actions{grid-column:2;grid-row:1}
  .layout{display:flex;flex-direction:column}.map-pane{height:55vh;min-height:390px}.sidebar{min-height:62vh;border-right:0;border-top:1px solid var(--line)}
}

/* Dark monochrome application surface */
:root{
  --pay:#e7823a;
  --open:#4aa8d1;
  --club:#a77bd6;
  --ink:#f2f1ef;
  --muted:#aaa6a0;
  --line:#484541;
  --panel:#262421;
  --soft:#302d2a;
  --accent:#f2f1ef;
}
body{background:#171614;color:var(--ink)}
.topbar{
  background:#171614;
  border-bottom:1px solid #3d3a36;
}
.search,.select,.ghost{
  border-color:#4a4742;
  background:#292725;
  color:#f3f2f0;
}
.search::placeholder{color:#8f8b85}
.ghost:hover{background:#35322f}
.sidebar{
  background:#22201e;
  border-right-color:#44413d;
}
.controls,.summary,.area-index-panel{
  border-color:#44413d;
}
.toggle,.filter-select,.mini-button,
.area-index-item,.actions button,.actions a{
  background:#302d2a;
  border-color:#504c47;
  color:#eeece9;
}
.toggle:hover,.mini-button:hover,
.area-index-item:hover,.actions button:hover,.actions a:hover{
  background:#3a3733;
}
.toggle[aria-pressed="false"]{opacity:.38}
.mini-button.active,.actions button.primary{
  background:#efede9;
  color:#1d1b19;
  border-color:#efede9;
}
.discovery-tools{
  border-color:#4c4944;
  background:#2b2926;
}
.discovery-status{color:#a8a49e}
.area-index-panel{background:#24221f}
.area-index-item{background:#302d2a}
.summary{color:#aaa6a0}
.summary strong{color:#f2f1ef}
#list{background:#22201e}
.card{
  background:#2b2926;
  border-color:#494641;
  color:#f1efec;
  box-shadow:0 5px 16px rgba(0,0,0,.12);
}
.card:hover{border-color:#66615b}
.card.unmapped{background:#272522}
.card.shortlisted{box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.address{color:#aaa6a0}
.tag{
  color:#d8d5d0;
  border-color:#514d48;
  background:#302d2a;
}
.actions button.saved{
  background:#42374e;
  border-color:#715f82;
  color:#f0e6fa;
}
.loading-cover{background:#1b1a18}
.loading-card{
  background:#292725;
  border-color:#4d4944;
  box-shadow:0 8px 30px rgba(0,0,0,.34);
}
.loading-card p{color:#aaa6a0}
.detection-progress,.cache-queue-status{
  background:rgba(38,36,33,.96);
  border-color:rgba(255,255,255,.14);
  color:#dedbd6;
}
.detection-progress-percent{color:#aaa6a0}
.detection-progress-track{background:#4b4843}
.detection-progress-fill{background:#efede9}
#map{background:#222}
.leaflet-control-zoom a,
.leaflet-control-layers{
  background:#292725!important;
  color:#eee!important;
  border-color:#4b4843!important;
}
.leaflet-control-zoom a:hover{background:#393632!important}

/* Dark facility detail card */
.facility-popup-shell .leaflet-popup-content-wrapper{
  padding:0;
  overflow:hidden;
  border:1px solid #55514b;
  border-radius:22px;
  background:#242220;
  color:#f4f2ee;
  box-shadow:0 15px 42px rgba(0,0,0,.5);
}
.facility-popup-shell .leaflet-popup-content{
  width:344px!important;
  margin:0;
}
.facility-popup-shell .leaflet-popup-tip{
  background:#242220;
  border:1px solid #55514b;
}
.facility-popup-shell .leaflet-popup-close-button{
  top:11px!important;
  right:11px!important;
  z-index:8;
  width:36px!important;
  height:36px!important;
  border-radius:50%;
  background:rgba(15,15,14,.9)!important;
  color:#fff!important;
  font-size:27px!important;
  line-height:32px!important;
  text-align:center;
}
.facility-popup{
  background:#242220;
  color:#f2f0ed;
}
.facility-photo{
  position:relative;
  height:164px;
  overflow:hidden;
  background:
    radial-gradient(circle at 25% 20%,#48545a 0,#2e3232 38%,#1f1e1c 100%);
}
.facility-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.facility-photo.failed img{display:none}
.facility-photo::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.02) 25%,
    rgba(0,0,0,.76) 100%
  );
  pointer-events:none;
}
.facility-photo-title{
  position:absolute;
  left:19px;
  right:55px;
  bottom:15px;
  z-index:2;
  font-size:20px;
  line-height:1.14;
  font-weight:900;
  text-shadow:0 2px 12px rgba(0,0,0,.65);
}
.facility-detail-body{
  padding:14px;
  display:grid;
  gap:10px;
}
.facility-address{
  padding:11px 12px;
  border:1px solid #514d48;
  border-radius:14px;
  background:#2c2926;
  color:#c9c5bf;
  font-size:12px;
  line-height:1.45;
}
.facility-stat-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}
.facility-stat{
  min-width:0;
  padding:9px 7px;
  border:1px solid #514d48;
  border-radius:13px;
  background:#2c2926;
  color:#c9c5bf;
  font-size:10px;
  font-weight:800;
  line-height:1.3;
  text-align:center;
}
.facility-stat strong{
  display:block;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:#f1efec;
  font-size:11px;
}
.facility-weather{
  min-height:70px;
  padding:11px 12px;
  border:1px solid #514d48;
  border-radius:14px;
  background:#2c2926;
  display:grid;
  grid-template-columns:auto 1fr;
  gap:10px;
  align-items:center;
}
.weather-icon{
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#37332f;
  font-size:23px;
}
.weather-main{
  color:#f2f0ed;
  font-size:12px;
  font-weight:850;
}
.weather-detail{
  margin-top:3px;
  color:#aaa6a0;
  font-size:10px;
  line-height:1.35;
}
.weather-credit{
  grid-column:1/-1;
  color:#77736e;
  font-size:8px;
}
.facility-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
.facility-actions a,
.facility-actions button{
  min-height:38px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #57524d;
  border-radius:11px;
  background:#302d2a;
  color:#efede9;
  text-decoration:none;
  font-size:10px;
  font-weight:850;
  cursor:pointer;
}
.facility-actions a:hover,
.facility-actions button:hover{
  background:#3b3733;
}
.facility-actions .layout-action{
  grid-column:1/-1;
  border-color:#d9d5cf;
  background:#efede9;
  color:#1d1b19;
  font-size:11px;
}
.facility-actions .layout-action:hover{background:#fff}
@media(max-width:520px){
  .facility-popup-shell .leaflet-popup-content{
    width:min(338px,calc(100vw - 48px))!important;
  }
}


/* Tennis-themed usability layer */
:root{
  --tennis-lime:#c8ef46;
  --tennis-lime-soft:#e4f8a2;
  --court-green:#1f9b63;
  --court-green-deep:#116844;
  --pay:#f0a33a;
  --open:#52bf77;
  --club:#9a82dd;
}
.brand{
  display:flex;
  align-items:center;
  gap:8px;
}
.brand::before{
  content:"";
  width:18px;
  height:18px;
  flex:0 0 18px;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%,transparent 56%,rgba(255,255,255,.75) 58% 64%,transparent 66%),
    var(--tennis-lime);
  box-shadow:0 0 0 1px rgba(0,0,0,.28);
}
.search:focus,.select:focus,.filter-select:focus{
  outline:2px solid var(--tennis-lime);
  outline-offset:1px;
}
.toggle[aria-pressed="true"]{
  border-color:rgba(200,239,70,.72);
  box-shadow:0 0 0 1px rgba(200,239,70,.16);
}
.mini-button.active,
.actions button.primary,
.facility-actions .layout-action{
  background:var(--tennis-lime);
  border-color:var(--tennis-lime);
  color:#171914;
}
.mini-button.active:hover,
.actions button.primary:hover,
.facility-actions .layout-action:hover{
  background:#d9fa61;
}
.discovery-tools{
  border-left:3px solid var(--tennis-lime);
}
.discovery-status strong{
  color:var(--tennis-lime-soft);
}
.card{
  transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease;
}
.card:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}
.card .actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
.card .actions .primary{
  grid-column:1/-1;
  min-height:38px;
  font-size:11px;
}
.card .actions button,
.card .actions a{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  text-align:center;
}
.card .actions button:disabled{
  cursor:wait;
  opacity:.72;
}
.tag.map-ready{
  border-color:rgba(82,191,119,.58);
  background:rgba(31,155,99,.12);
  color:#bce8cb;
}
.tag.map-pending{
  border-color:rgba(200,239,70,.42);
  background:rgba(200,239,70,.08);
  color:#dff49a;
}
.mapping-pulse{
  display:inline-block;
  width:7px;
  height:7px;
  margin-right:4px;
  border-radius:50%;
  background:var(--tennis-lime);
  box-shadow:0 0 0 0 rgba(200,239,70,.5);
  animation:mappingPulse 1.45s infinite;
}
@keyframes mappingPulse{
  0%{box-shadow:0 0 0 0 rgba(200,239,70,.48)}
  75%,100%{box-shadow:0 0 0 7px rgba(200,239,70,0)}
}
.detection-progress-fill{
  background:linear-gradient(90deg,var(--court-green),var(--tennis-lime));
}
#map .leaflet-court-color-pane{

}

<body>
<div class="app">
  <header class="topbar">
    <div class="brand">LA Tennis Court Finder</div>
    <input id="search" class="search" type="search" placeholder="Search court, park, city, or address">
    <div class="top-actions">
      <select id="city" class="select" aria-label="Filter by city"><option value="">All cities</option></select>
      <button id="locate" class="ghost" type="button">Locate me</button>
      <button id="share" class="ghost" type="button">Share view</button>
      <button id="reset" class="ghost" type="button">Reset</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="controls">
        <div class="toggles">
          <button class="toggle" data-category="pay" aria-pressed="true"><span class="swatch" style="background:var(--pay)"></span>Pay courts</button>
          <button class="toggle" data-category="open" aria-pressed="true"><span class="swatch" style="background:var(--open)"></span>Open play</button>
          <button class="toggle" data-category="club" aria-pressed="true"><span class="swatch" style="background:var(--club)"></span>Clubs</button>
        </div>

        <div class="control-row">
          <select id="clusterMode" class="filter-select" aria-label="Cluster mode">
            <option value="category">Clusters by category</option>
            <option value="all">One combined cluster</option>
            <option value="off">Individual dots</option>
          </select>
          <select id="lights" class="filter-select" aria-label="Lighting filter">
            <option value="">Any lighting</option>
            <option value="yes">Lighted</option>
            <option value="no">Unlighted</option>
            <option value="unknown">Lighting unknown</option>
          </select>
          <select id="mapped" class="filter-select" aria-label="Map availability">
            <option value="">Mapped and unmapped</option>
            <option value="mapped">Mapped only</option>
            <option value="unmapped">Unmapped only</option>
          </select>
        </div>

        <div class="control-row">
          <select id="sort" class="filter-select" aria-label="Sort order">
            <option value="name">Sort by name</option>
            <option value="city">Sort by city</option>
            <option value="distance">Sort by distance</option>
          </select>
          <button id="shortlistOnly" class="mini-button" type="button">Shortlist only</button>
          <button id="fit" class="mini-button" type="button">Fit visible</button>
        </div>

        <div class="discovery-tools">
          <div class="discovery-title">Find courts</div>
          <div class="discovery-row">
            <button id="findNearMe" class="mini-button" type="button">Find courts near me</button>
            <select id="nearRadius" class="filter-select radius-select" aria-label="Search radius">
              <option value="1">1 mile</option>
              <option value="3">3 miles</option>
              <option value="5" selected>5 miles</option>
              <option value="10">10 miles</option>
              <option value="15">15 miles</option>
              <option value="25">25 miles</option>
            </select>
          </div>
          <div class="discovery-row">
            <button id="brushArea" class="mini-button" type="button">Find courts around this area</button>
            <button id="clearDiscovery" class="mini-button" type="button">Clear area/radius</button>
            
          </div>
          <div id="discoveryStatus" class="discovery-status">Search by location or draw an area on the map.</div>
        </div>
      </div>

      <div class="summary">
        <span id="status"><strong>Loading saved locations…</strong></span>
        <span id="visibleCount"></span>
      </div>

      <div id="areaIndexPanel" class="area-index-panel" hidden>
        <div class="area-index-head">
          <span id="areaIndexTitle">Courts in selected area</span>
          <span id="areaIndexCount"></span>
        </div>
        <div id="areaIndexList" class="area-index-list"></div>
      </div>

      <div id="list"></div>
    </aside>

    <section class="map-pane">
      <div id="map"></div>
      <div id="mapError" class="loading-cover">
        <div class="loading-card">
          <h2>Opening the map…</h2>
          <p>The court list is ready while the full-color satellite map loads.</p>
        </div>
      </div>
      <div id="detectionProgress" class="detection-progress" hidden role="status" aria-live="polite">
        <div class="detection-progress-row">
          <span id="detectionProgressLabel">Preparing court detection…</span>
          <span id="detectionProgressPercent" class="detection-progress-percent">0%</span>
        </div>
        <div
          id="detectionProgressTrack"
          class="detection-progress-track"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          aria-label="Court detection progress"
        >
          <div id="detectionProgressFill" class="detection-progress-fill"></div>
        </div>
      </div>
</section>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

function esc(value){
  return String(value??"").replace(/[&<>"']/g,ch=>({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
  })[ch]);
}
function normalizeAddress(c){
  return String(c.address||"").toLowerCase().replace(/\s+/g," ").trim();
}
function validPoint(lat,lng){
  return Number.isFinite(lat)&&Number.isFinite(lng)&&lat>32.8&&lat<35&&lng>-119.2&&lng<-117.3;
}
function hasPoint(c){
  return validPoint(Number(c.lat),Number(c.lng));
}
function cacheCandidates(c){
  const address=normalizeAddress(c);
  return [
    `la-tennis-fast-v1:${c.id}`,
    `la-tennis-exact-v3:${c.id}`,
    `la-tennis-exact-v2:${c.id}`,
    `la-tennis-exact-v1:${c.id}`,
    `precise-v3:${address}`,
    `geo:${address}`
  ];
}
function parseCache(raw){
  if(!raw)return null;
  try{
    const v=JSON.parse(raw);
    const lat=Number(v.lat),lng=Number(v.lng);
    if(validPoint(lat,lng)){
      return {lat,lng,map_accuracy:v.map_accuracy||v.accuracy||"saved address match"};
    }
  }catch(_){}
  return null;
}
function runtimePointKey(c){
  return `la-tennis-runtime-point-v1:${c.id}`;
}
function readSavedPoint(c){
  try{
    const runtime=parseCache(
      sessionStorage.getItem(runtimePointKey(c))
    );
    if(runtime)return runtime;
  }catch(_){}

  for(const key of cacheCandidates(c)){
    const hit=parseCache(localStorage.getItem(key));
    if(hit)return hit;
  }
  return null;
}
function saveRuntimePoint(c){
  if(!hasPoint(c))return;
  try{
    sessionStorage.setItem(
      runtimePointKey(c),
      JSON.stringify({
        lat:Number(c.lat),
        lng:Number(c.lng),
        map_accuracy:
          c.map_accuracy||"temporary address match"
      })
    );
  }catch(_){}
}
function savePoint(c){
  if(!hasPoint(c))return;
  const payload=JSON.stringify({lat:Number(c.lat),lng:Number(c.lng),map_accuracy:c.map_accuracy||"saved address match"});
  try{
    localStorage.setItem(`la-tennis-fast-v1:${c.id}`,payload);
    localStorage.setItem(`geo:${normalizeAddress(c)}`,payload);
  }catch(_){}
}
function hydrateSavedPoints(){
  for(const c of COURTS){
    if(hasPoint(c)){savePoint(c);continue}
    const saved=readSavedPoint(c);
    if(saved)Object.assign(c,saved);
  }
}
function waitMilliseconds(milliseconds){
  return new Promise(resolve=>
    window.setTimeout(resolve,milliseconds)
  );
}
function waitForVisibleDocument(){
  if(!document.hidden)return Promise.resolve();
  return new Promise(resolve=>{
    const handle=()=>{
      if(document.hidden)return;
      document.removeEventListener(
        "visibilitychange",handle
      );
      resolve();
    };
    document.addEventListener(
      "visibilitychange",handle
    );
  });
}
function acceptedGeocodeType(type){
  return new Set([
    "PointAddress",
    "Subaddress",
    "StreetAddress",
    "StreetInt",
    "StreetMidBlock",
    "StreetBetween",
    "POI"
  ]).has(String(type||""));
}
async function requestAddressCandidate(c,query,minimumScore){
  const url=
    "https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?"+
    new URLSearchParams({
      SingleLine:query,
      sourceCountry:"USA",
      outFields:[
        "Match_addr",
        "Addr_type",
        "City",
        "Region",
        "Postal"
      ].join(","),
      maxLocations:"1",
      forStorage:"false",
      outSR:"4326",
      f:"json"
    });

  const response=await fetchWithTimeout(
    url,
    {mode:"cors"},
    5200
  );
  if(!response.ok){
    throw new Error(
      `Address service returned ${response.status}`
    );
  }

  const data=await response.json();
  const candidate=data?.candidates?.[0];
  const lat=Number(candidate?.location?.y);
  const lng=Number(candidate?.location?.x);
  const score=Number(candidate?.score||0);
  const type=candidate?.attributes?.Addr_type;
  const region=String(
    candidate?.attributes?.Region||""
  ).toUpperCase();

  if(
    !candidate||
    score<minimumScore||
    !validPoint(lat,lng)||
    !acceptedGeocodeType(type)||
    (region&&region!=="CA"&&region!=="CALIFORNIA")
  ){
    return null;
  }

  return {
    lat,
    lng,
    map_accuracy:
      `${type||"address"} match · ${Math.round(score)}%`
  };
}
async function geocodeCourtAddress(c){
  const exact=await requestAddressCandidate(
    c,
    String(c.address||"").trim(),
    76
  ).catch(()=>null);
  if(exact)return exact;

  return await requestAddressCandidate(
    c,
    `${c.name}, ${c.city}, California`,
    88
  ).catch(()=>null);
}
async function ensureCourtPoint(c){
  if(hasPoint(c))return c;
  if(addressMappingInFlight.has(c.id)){
    return addressMappingInFlight.get(c.id);
  }

  const promise=(async ()=>{
    const point=await geocodeCourtAddress(c);
    if(!point)return null;
    Object.assign(c,point);
    saveRuntimePoint(c);
    return c;
  })().finally(()=>{
    addressMappingInFlight.delete(c.id);
  });

  addressMappingInFlight.set(c.id,promise);
  return promise;
}
function refreshBackgroundMappingUI(force=false){
  const now=Date.now();
  if(
    !force&&
    now-backgroundMappingLastRefresh<700
  )return;

  backgroundMappingLastRefresh=now;
  renderList();
  rebuildMapLayers();
}
async function startBackgroundAddressMapping(){
  if(backgroundMappingPromise)return backgroundMappingPromise;

  const pending=COURTS.filter(c=>!hasPoint(c));
  backgroundMappingTotal=pending.length;
  if(!pending.length){
    backgroundMappingFinished=true;
    refreshBackgroundMappingUI(true);
    return;
  }

  backgroundMappingRunning=true;
  backgroundMappingFinished=false;
  backgroundMappingAttempted=0;
  backgroundMappingResolved=0;
  backgroundMappingFailures=0;
  refreshBackgroundMappingUI(true);

  let cursor=0;
  const worker=async ()=>{
    while(cursor<pending.length){
      await waitForVisibleDocument();
      const index=cursor++;
      const court=pending[index];
      backgroundMappingAttempted++;

      const mapped=await ensureCourtPoint(court);
      if(mapped)backgroundMappingResolved++;
      else backgroundMappingFailures++;

      refreshBackgroundMappingUI(false);
      await waitMilliseconds(210);
    }
  };

  backgroundMappingPromise=Promise.all([
    worker(),
    worker()
  ]).finally(()=>{
    backgroundMappingRunning=false;
    backgroundMappingFinished=true;
    refreshBackgroundMappingUI(true);
    showToast(
      `${COURTS.filter(hasPoint).length} of ${COURTS.length} facilities are now mapped.`
    );
  });

  return backgroundMappingPromise;
}
function categoryColor(category){return COLORS[category]||"#666"}
function categoryLabel(category){return LABELS[category]||category}
function lightLabel(value){
  if(value==="yes")return "Lighted";
  if(value==="no")return "Unlighted";
  return "Lighting unknown";
}
function courtCountLabel(c){
  const n=Number(c.court_count);
  return Number.isFinite(n)&&n>0?`${n} court${n===1?"":"s"}`:"Court count not listed";
}
function distanceMiles(a,b){
  if(!a||!b)return Infinity;
  const R=3958.8;
  const rad=x=>x*Math.PI/180;
  const dLat=rad(b.lat-a.lat),dLng=rad(b.lng-a.lng);
  const lat1=rad(a.lat),lat2=rad(b.lat);
  const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function matchesFilters(c){
  if(!enabled.has(c.category))return false;

  const city=document.getElementById("city").value;
  if(city&&c.city!==city)return false;

  const q=document.getElementById("search").value.trim().toLowerCase();
  if(q&&![c.name,c.city,c.address].join(" ").toLowerCase().includes(q))return false;

  const lights=document.getElementById("lights").value;
  if(lights){
    const actual=c.lights==="yes"?"yes":c.lights==="no"?"no":"unknown";
    if(actual!==lights)return false;
  }

  const mapped=document.getElementById("mapped").value;
  if(mapped==="mapped"&&!hasPoint(c))return false;
  if(mapped==="unmapped"&&hasPoint(c))return false;

  if(proximityRadiusMiles!==null){
    if(!userLocation||!hasPoint(c))return false;
    const distance=distanceMiles(userLocation,{
      lat:Number(c.lat),lng:Number(c.lng)
    });
    if(distance>proximityRadiusMiles)return false;
  }

  if(regionFilterBounds){
    if(!hasPoint(c)||!regionFilterBounds.contains([
      Number(c.lat),Number(c.lng)
    ]))return false;
  }

  if(shortlistOnly&&!shortlisted.has(c.id))return false;

  return true;
}
function sortCourts(items){
  const mode=document.getElementById("sort").value;

    if(mode==="distance"){
      const da=hasPoint(a)&&userLocation?distanceMiles(userLocation,{lat:Number(a.lat),lng:Number(a.lng)}):Infinity;
      const db=hasPoint(b)&&userLocation?distanceMiles(userLocation,{lat:Number(b.lat),lng:Number(b.lng)}):Infinity;
      if(da!==db)return da-db;
    }
    if(mode==="city"){
      return (a.city||"").localeCompare(b.city||"")||(a.name||"").localeCompare(b.name||"");
    }
    return (a.name||"").localeCompare(b.name||"");
  });
}

  if(value===3)return "Overcast";
  if([45,48].includes(value))return "Fog";
  if(value>=51&&value<=57)return "Drizzle";
  if(value>=61&&value<=67)return "Rain";
  if(value>=71&&value<=77)return "Snow";

async function hydrateFacilityWeather(c){
  const target=document.getElementById(
    `facility-weather-${c.id}`
  );
  if(!target)return;

  const cached=facilityWeatherCache.get(c.id);
  if(cached&&Date.now()-cached.savedAt<10*60*1000){
    renderFacilityWeather(target,cached.current);
    return;
  }

  const point=facilityDisplayPoint(c);
  try{
    const response=await fetch(
      "https://api.open-meteo.com/v1/forecast?"+
      new URLSearchParams({
        latitude:String(point.lat),
        longitude:String(point.lng),
        current:[
          "temperature_2m",
          "apparent_temperature",
          "precipitation",
          "weather_code",
          "wind_speed_10m",
          "is_day"
        ].join(","),
        temperature_unit:"fahrenheit",
        wind_speed_unit:"mph",
        precipitation_unit:"inch",
        timezone:"auto"
      }),
      {mode:"cors"}
    );
    if(!response.ok){
      throw new Error(`Weather service returned ${response.status}`);
    }
    const data=await response.json();
    if(!data.current){
      throw new Error("No current weather returned");
    }
    facilityWeatherCache.set(c.id,{
      current:data.current,
      savedAt:Date.now()
    });
    if(document.getElementById(target.id)){
      renderFacilityWeather(target,data.current);
    }

    console.warn("Facility weather unavailable",error);
    target.innerHTML=`
      <div class="weather-icon">🌤️</div>
      <div>

}

function rotatedRectangle(lat,lng,widthMeters,heightMeters,angleDegrees){
  const angle=angleDegrees*Math.PI/180;
  const halfW=widthMeters/2;
  const halfH=heightMeters/2;
  const corners=[
    [-halfW,-halfH],
    [ halfW,-halfH],
    [ halfW, halfH],
    [-halfW, halfH]
  ].map(([x,y])=>{
    const east=x*Math.cos(angle)-y*Math.sin(angle);
    const north=x*Math.sin(angle)+y*Math.cos(angle);
    return destinationPoint(lat,lng,east,north);
  });
  corners.push([...corners[0]]);
  return corners;
}
function provisionalCourtPolygons(c){
  const lat=Number(c.lat);
  const lng=Number(c.lng);
  const listed=Math.max(1,Math.min(8,Number(c.court_count)||1));

  // A regulation tennis court plus common runoff is roughly 36.6 m × 18.3 m.
  // Use a compact multi-court arrangement so the color reveal appears instantly.
  const courtLength=43;
  const courtWidth=23;
  const gap=2;
  const cols=listed<=2?listed:Math.ceil(Math.sqrt(listed));
  const rows=Math.ceil(listed/cols);

  const totalWidth=cols*courtWidth+(cols-1)*gap;
  const totalHeight=rows*courtLength+(rows-1)*gap;
  const polygons=[];
  let index=0;

  for(let row=0;row<rows;row++){
    for(let col=0;col<cols;col++){
      if(index>=listed)break;
      const east=(col-(cols-1)/2)*(courtWidth+gap);
      const north=((rows-1)/2-row)*(courtLength+gap);
      const center=destinationPoint(lat,lng,east,north);
      polygons.push(rotatedRectangle(center[0],center[1],courtWidth,courtLength,0));
      index++;
    }
  }

  return polygons;
}

function haversineMeters(a,b){
  const R=6371000;
  const rad=value=>value*Math.PI/180;
  const dLat=rad(b.lat-a.lat);
  const dLng=rad(b.lng-a.lng);
  const lat1=rad(a.lat);
  const lat2=rad(b.lat);
  const h=Math.sin(dLat/2)**2+
    Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function polygonCentroid(poly){
  let lat=0,lng=0;
  const points=(poly.length>1&&poly[0][0]===poly[poly.length-1][0]&&poly[0][1]===poly[poly.length-1][1])
    ? poly.slice(0,-1)
    : poly;
  for(const pair of points){
    lat+=Number(pair[0]);
    lng+=Number(pair[1]);
  }
  return {lat:lat/points.length,lng:lng/points.length};
}
function expandCourtPolygon(poly,paddingMeters=7){
  if(!Array.isArray(poly)||poly.length<3)return poly;

  const center=polygonCentroid(poly);
  const metersPerDegreeLat=111320;
  const metersPerDegreeLng=111320*Math.cos(center.lat*Math.PI/180);
  const points=(poly.length>1&&poly[0][0]===poly[poly.length-1][0]&&poly[0][1]===poly[poly.length-1][1])
    ? poly.slice(0,-1)
    : poly;

  let maxRadius=0;
  for(const pair of points){
    const north=(Number(pair[0])-center.lat)*metersPerDegreeLat;
    const east=(Number(pair[1])-center.lng)*metersPerDegreeLng;
    maxRadius=Math.max(maxRadius,Math.hypot(east,north));
  }

  // Scale outward by a fixed real-world apron, capped to avoid coloring
  // unrelated facilities when a source polygon is unusually large.
  const scale=Math.min(1.34,1+paddingMeters/Math.max(12,maxRadius));
  const expanded=points.map(pair=>[
    center.lat+(Number(pair[0])-center.lat)*scale,
    center.lng+(Number(pair[1])-center.lng)*scale
  ]);
  expanded.push([...expanded[0]]);
  return expanded;
}
function expandCourtArea(polygons,paddingMeters=7){
  return (polygons||[])
    .filter(poly=>Array.isArray(poly)&&poly.length>=3)
    .map(poly=>expandCourtPolygon(poly,paddingMeters));

function parseOverpassPolygons(data){
  const polygons=[];
  for(const element of data.elements||[]){
    const geometry=Array.isArray(element.geometry)?element.geometry:null;
    if(!geometry||geometry.length<3)continue;

    const polygon=geometry
      .map(point=>[Number(point.lat),Number(point.lon)])
      .filter(pair=>validPoint(pair[0],pair[1]));

    if(polygon.length<3)continue;

    const first=polygon[0];
    const last=polygon[polygon.length-1];
    if(first[0]!==last[0]||first[1]!==last[1])polygon.push([...first]);

    polygons.push(polygon);
  }
  return polygons;
}
function chooseFacilityCourtPolygons(c,polygons,referencePolygons=[]){
  if(!polygons.length)return [];

  const facility={lat:Number(c.lat),lng:Number(c.lng)};
  const references=(referencePolygons||[])
    .filter(poly=>Array.isArray(poly)&&poly.length>=3)
    .map(polygonCentroid);
  const listed=Math.max(0,Number(c.court_count)||0);

  const items=polygons
    .map(poly=>({poly,center:polygonCentroid(poly)}))
    .map(item=>{
      const facilityDistance=haversineMeters(facility,item.center);
      const referenceDistance=references.length
        ?Math.min(...references.map(ref=>haversineMeters(ref,item.center)))
        :facilityDistance;
      return {...item,facilityDistance,referenceDistance};
    })
    .filter(item=>item.facilityDistance<=1150);

  if(!items.length)return [];

  const groups=[];
  const visited=new Set();
  for(let start=0;start<items.length;start++){
    if(visited.has(start))continue;
    const queue=[start];
    const group=[];
    visited.add(start);

    while(queue.length){
      const index=queue.shift();
      const item=items[index];
      group.push(item);

      for(let other=0;other<items.length;other++){
        if(visited.has(other))continue;
        if(haversineMeters(item.center,items[other].center)<=225){
          visited.add(other);
          queue.push(other);
        }
      }
    }

    const nearestFacility=Math.min(...group.map(item=>item.facilityDistance));
    const nearestReference=Math.min(...group.map(item=>item.referenceDistance));

      label=Math.min(2,Math.floor(hsv.v*3));

      const index=stack.pop();

          const next=ny*size+nx;

            visited[next]=1;
            stack.push(next);
          }
        }
      }

    largestComponent=Math.max(largestComponent,area);

  let centerTop=0,centerTotal=0,borderTop=0,borderTotal=0;
  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){

        y>=size*.12&&y<size*.88;

  const borderDensity=borderTop/Math.max(1,borderTotal);

    vector:[
      sorted[0]||0,
      (sorted[0]||0)+(sorted[1]||0),
      (sorted[0]||0)+(sorted[1]||0)+(sorted[2]||0),
      1-entropy,

      topPixelCount?largestComponent/topPixelCount:0,

  }

  const paletteOrder=vector[3]||0;
  const agreement=vector[4]||0;
  const component=vector[5]||0;
  const validFraction=vector[9]||0;

          transpose,
          angleOffset

    score:0,
    layout:"none",
    lineScore:0,

  const pixelShort=Math.min(box.width,box.height);
  const aspect=pixelLong/Math.max(1,pixelShort);

    component.points.length/

  if(aspect<1.08||aspect>7.0)return null;

    box.center,bounds,width,height
  );

  const distance=haversineMeters(
    {lat:Number(c.lat),lng:Number(c.lng)},
    center

  const distanceScale=Number(options.distanceScale)||170;
  if(distance>maxDistance)return null;

  const listedHint=Math.max(
    1,Math.min(12,Number(c.court_count)||1)

  const lineReference=imageData
    ?courtAerialReferenceScore(
      imageData,box,width,height,listedHint,options
    )
    :{
      score:0,
      ratioScore:0,
      lineScore:0,
      coverage:0,
      axisBalance:0,
      verticalPeaks:0,
      horizontalPeaks:0,
      layout:"none",
      layoutCourts:1
    };

  const ratioThreshold=Number(options.ratioThreshold)||
    (options.strictReference?.44:.34);

  const colorReference=imageData
    ?courtColorThemeReferenceScore(
      imageData,box,width,height
    )
    :{
      score:0,
      scatteredPenalty:1,
      matchedReference:"none"
    };

  const minimumColor=Number(options.colorThemeThreshold)||
    (strict?.54:.45);

  if(colorReference.scatteredPenalty>.58)return null;

    lineReference.horizontalPeaks>=2;

    widthRatioScore:lineReference.widthRatioScore,
    lengthRatioScore:lineReference.lengthRatioScore,
    referenceScore:lineReference.score,
    referenceLayout:lineReference.layout,
    lineScore:lineReference.lineScore,
    lineCoverage:lineReference.coverage,

      const index=queue.shift();
      indexes.push(index);

        if(visited.has(other))continue;

          (distance<=joinDistance&&angleDiff<=Math.PI/7)||
          distance<=58

        }
      }
    }

    const units=items.reduce((sum,item)=>sum+item.estimatedCourts,0);

    const totalArea=items.reduce((sum,item)=>sum+item.area,0);
    const ratioConsistency=items.reduce(
      (sum,item)=>sum+(item.lineRatioScore||0),0
    )/items.length;
    const meanAngle=items.reduce((sum,item)=>sum+item.angle,0)/items.length;
    const alignment=1-Math.min(
      1,
      items.reduce((sum,item)=>
        sum+normalizedAngleDifference(item.angle,meanAngle),
      0)/(items.length*Math.PI/4)
    );

    const countMatch=Math.exp(
      -Math.abs(units-target)/Math.max(2,target*.75)
    );
    const distanceScore=Math.exp(
      -nearestDistance/(Number(options.distanceScale)||500)
    );
    const multiScore=Math.min(
      1,units/Math.max(2,listed||3)
    );

      .34*averageScore+
      .20*countMatch+
      .15*distanceScore+
      .14*multiScore+

        }
      }
      closed[i]=count>=11?1:0;
    }
  }

  const visited=new Uint8Array(total);
  const components=[];
  const stack=[];

  for(let y=2;y<height-2;y++){
    for(let x=2;x<width-2;x++){
      const start=y*width+x;
      if(!closed[start]||visited[start])continue;

      stack.length=0;
      stack.push(start);
      visited[start]=1;
      const points=[];
      let colorSum=0,uniformSum=0;

      while(stack.length){
        const i=stack.pop();
        const px=i%width;
        const py=(i-px)/width;
        points.push({x:px,y:py});
        colorSum+=colorfulness[i];
        uniformSum+=uniformity[i];

        for(let dy=-1;dy<=1;dy++){
          for(let dx=-1;dx<=1;dx++){
            if(!dx&&!dy)continue;
            const nx=px+dx,ny=py+dy;
            const ni=ny*width+nx;
            if(nx<1||ny<1||nx>=width-1||ny>=height-1)continue;
            if(closed[ni]&&!visited[ni]){
              visited[ni]=1;
              stack.push(ni);
            }
          }
        }
      }

      const minPixels=Number(options.minComponentPixels)||45;
      if(points.length<minPixels||points.length>width*height*.18)continue;
      components.push({
        points,
        colorfulness:colorSum/points.length,
        uniformity:uniformSum/points.length
      });
    }
  }

  const scored=components
    .map(component=>imageComponentScore(component,c,bounds,width,height,options,imageData))
    .filter(Boolean)
    .sort((a,b)=>b.score-a.score);

  const scoreThreshold=Number(options.scoreThreshold)||.53;
  const plausible=scored.filter(item=>item.score>=scoreThreshold-.05);
  const selected=clusterVisualCourtCandidates(plausible,c,{
    candidateJoinDistance:Number(options.candidateJoinDistance)||125,
    distanceScale:Number(options.distanceScale)||500,
    minimumGroupScore:Number(options.minimumGroupScore)||.38,
    returnAllGroups:Boolean(options.returnAllGroups),
    maxGroups:Number(options.maxGroups)||12
  });

  return selected.map(item=>{
    const center=item.box.center;
    const shrink=.96;
    const corners=item.box.corners.map(point=>({
      x:center.x+(point.x-center.x)*shrink,
      y:center.y+(point.y-center.y)*shrink
    }));
    const polygon=corners.map(point=>
      pixelToLatLng(point,bounds,width,height)
    );
    polygon.push([...polygon[0]]);
    return polygon;
  });
}
function courtWindowBox(centerX,centerY,shortPx,longPx,longAngle){
  return {
    center:{x:centerX,y:centerY},
    width:shortPx,
    height:longPx,
    angle:longAngle-Math.PI/2
  };
}
function scoreStandardCourtWindow(
  imageData,width,height,centerX,centerY,
  shortPx,longPx,longAngle,patchSize=32
){
  const box=courtWindowBox(
    centerX,centerY,shortPx,longPx,longAngle
  );
  const patch=orientedCourtColorPatch(
    imageData,box,width,height,patchSize,false,0
  );
  const theme=scoreCourtColorThemePatch(
    patch,patchSize
  );
  const descriptor=buildCalibrationDescriptor(
    patch,patchSize,theme
  );
  const gray=rgbPatchToGray(patch,patchSize);
  const features=edgeProfilesFromPatch(
    gray,patchSize
  );
  const line=scoreCourtReferenceLayout(
    features,
    {
      name:"individual court",
      rows:1,
      cols:1,
      aspect:TENNIS_COURT_LINE_RATIOS.doublesAspect
    },
    TENNIS_COURT_LINE_RATIOS.doublesAspect,
    1
  );

  const axisSupport=Math.min(
    1,
    Math.min(
      descriptor.peaksX,
      descriptor.peaksY
    )/3
  );
  const score=
    .38*theme.score+
    .34*line.score+
    .22*line.ratioScore+
    .04*descriptor.lineConcentration+
    .02*axisSupport;

  return {
    score,
    theme,
    descriptor,
    line,
    lineRatioScore:line.ratioScore,
    box,
    centerX,
    centerY,
    longAngle
  };
}
function standardWindowCandidatePolygon(
  candidate,bounds,width,height
){
  const box=courtWindowBox(
    candidate.centerX,
    candidate.centerY,
    candidate.shortPx,
    candidate.longPx,
    candidate.longAngle
  );
  const angle=box.angle;
  const ux=Math.cos(angle),uy=Math.sin(angle);
  const vx=-uy,vy=ux;
  const halfW=box.width/2;
  const halfH=box.height/2;
  const corners=[
    [-halfW,-halfH],
    [ halfW,-halfH],
    [ halfW, halfH],
    [-halfW, halfH]
  ].map(([alongU,alongV])=>({
    x:box.center.x+alongU*ux+alongV*vx,
    y:box.center.y+alongU*uy+alongV*vy
  }));

  const polygon=corners.map(point=>
    pixelToLatLng(point,bounds,width,height)
  );
  polygon.push([...polygon[0]]);
  return polygon;
}
function rankStandardCourtWindows(
  imageData,c,bounds,width,height,options={}
){
  const clock=()=>(
    globalThis.performance?.now?.()??Date.now()
  );
  const startedAt=clock();
  const budgetMs=Math.max(
    180,
    Number(options.scanBudgetMs)||720
  );
  const deadline=startedAt+budgetMs;
  const expired=()=>clock()>=deadline;

  const mpp=metersPerPixel(bounds,width,height);
  const metersPerPixel=(mpp.x+mpp.y)/2;

  // Geographic scale seeds crop sizes only. Confidence remains based
  // on normalized tennis-line ratios.
  const baseShort=18.29/Math.max(.1,metersPerPixel);
  const baseLong=36.58/Math.max(.1,metersPerPixel);
  const scales=Array.isArray(options.windowScales)
    ?options.windowScales
    :[.82,1,1.2];

  const windows=scales
    .map(scale=>({
      scale,
      shortPx:baseShort*scale,
      longPx:baseLong*scale
    }))
    .filter(window=>
      window.shortPx>=4&&window.longPx>=8
    );
  if(!windows.length)return [];

  const maximumLong=Math.max(
    ...windows.map(window=>window.longPx)
  );
  const minimumShort=Math.min(
    ...windows.map(window=>window.shortPx)
  );
  const margin=Math.ceil(maximumLong*.62);
  const patchSize=Number(options.patchSize)||28;
  const step=Math.max(
    Number(options.minimumStep)||9,
    Math.round(
      minimumShort*
      (Number(options.stepScale)||1.16)
    )
  );
  const angleStep=
    Number(options.angleStepDegrees)||60;
  const keep=Number(options.keepCandidates)||12;
  const refineSeeds=Number(options.refineSeeds)||4;
  const refineOffsets=Array.isArray(options.refineOffsets)
    ?options.refineOffsets
    :[-4,0,4];
  const refineAngles=Array.isArray(options.refineAngles)
    ?options.refineAngles
    :[-9,0,9];

  const top=[];
  const add=result=>{
    if(!Number.isFinite(result.score))return;
    top.push(result);
    top.sort((a,b)=>b.score-a.score);
    if(top.length>keep)top.length=keep;
  };

  coarseScan:
  for(let y=margin;y<height-margin;y+=step){
    if(expired())break;
    for(let x=margin;x<width-margin;x+=step){
      if(expired())break coarseScan;
      for(const window of windows){
        for(
          let degrees=0;
          degrees<180;
          degrees+=angleStep
        ){
          if(expired())break coarseScan;
          const result=scoreStandardCourtWindow(
            imageData,
            width,
            height,
            x,
            y,
            window.shortPx,
            window.longPx,
            degrees*Math.PI/180,
            patchSize
          );
          result.windowScale=window.scale;
          result.shortPx=window.shortPx;
          result.longPx=window.longPx;
          add(result);
        }
      }
    }
  }

  if(!top.length)return [];

  const refined=[];
  refinement:
  for(const seed of top.slice(0,refineSeeds)){
    for(const dx of refineOffsets){
      for(const dy of refineOffsets){
        for(const degrees of refineAngles){
          if(expired())break refinement;
          const result=scoreStandardCourtWindow(
            imageData,
            width,
            height,
            Math.max(
              margin,
              Math.min(width-margin,seed.centerX+dx)
            ),
            Math.max(
              margin,
              Math.min(height-margin,seed.centerY+dy)
            ),
            seed.shortPx,
            seed.longPx,
            seed.longAngle+degrees*Math.PI/180,
            patchSize
          );
          result.windowScale=seed.windowScale;
          result.shortPx=seed.shortPx;
          result.longPx=seed.longPx;
          refined.push(result);
        }
      }
    }
  }

  const ranked=[...refined,...top]
    .sort((a,b)=>b.score-a.score);

  for(const candidate of ranked){
    candidate.polygon=standardWindowCandidatePolygon(
      candidate,bounds,width,height
    );
    candidate.centerLatLng=polygonCentroid(
      candidate.polygon
    );
    candidate.source=
      "time-bounded line-ratio scan";
    candidate.scanElapsedMs=Math.round(
      clock()-startedAt
    );
  }

  return ranked;
}
function scanStandardCourtWindows(
  imageData,c,bounds,width,height,options={}
){
  return rankStandardCourtWindows(
    imageData,c,bounds,width,height,options
  )[0]||null;
}
function scanStandardCourtWindowsTopK(
  imageData,c,bounds,width,height,options={}
){
  const ranked=rankStandardCourtWindows(
    imageData,c,bounds,width,height,options
  );
  const maxResults=Math.max(
    1,Number(options.maxResults)||4
  );
  const minimumScore=Number(options.minimumScore)||0;
  const selected=[];

  for(const candidate of ranked){
    if(candidate.score<minimumScore)continue;

    const separated=selected.every(existing=>{
      const dx=candidate.centerX-existing.centerX;
      const dy=candidate.centerY-existing.centerY;
      const distance=Math.hypot(dx,dy);
      return distance>
        Math.min(candidate.shortPx,existing.shortPx)*.72;
    });
    if(!separated)continue;

    selected.push(candidate);
    if(selected.length>=maxResults)break;
  }

  return selected;
}
async function detectCourtPolygonsFromSatellite(
  c,onProgress=()=>{},options={}
){
  const radiusMeters=Number(options.radiusMeters)||800;
  const requestedLatLngBounds=
    options.bounds||analysisBounds(c,radiusMeters);
  const requestedBounds=options.bounds
    ?mercatorBoundsFromLatLngBounds(requestedLatLngBounds)
    :mercatorBoundsForCourt(c,radiusMeters);

  const maximumSource=Number(options.sourceSize)||640;
  const maximumAnalysis=Number(options.analysisSize)||320;
  const spanX=Math.max(1,requestedBounds.xmax-requestedBounds.xmin);
  const spanY=Math.max(1,requestedBounds.ymax-requestedBounds.ymin);
  const aspect=spanX/spanY;

  let sourceWidth,sourceHeight,analysisWidth,analysisHeight;
  if(aspect>=1){
    sourceWidth=maximumSource;
    sourceHeight=Math.max(
      192,Math.round(maximumSource/aspect)
    );
    analysisWidth=maximumAnalysis;
    analysisHeight=Math.max(
      96,Math.round(maximumAnalysis/aspect)
    );
  }else{
    sourceHeight=maximumSource;
    sourceWidth=Math.max(
      192,Math.round(maximumSource*aspect)
    );
    analysisHeight=maximumAnalysis;
    analysisWidth=Math.max(
      96,Math.round(maximumAnalysis*aspect)
    );
  }

  const service=
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export";
  const metadataUrl=service+"?"+new URLSearchParams({
    bbox:[
      requestedBounds.xmin,
      requestedBounds.ymin,
      requestedBounds.xmax,
      requestedBounds.ymax
    ].join(","),
    bboxSR:"3857",
    imageSR:"3857",
    size:`${sourceWidth},${sourceHeight}`,
    format:"png32",
    transparent:"false",
    f:"json"
  });

  onProgress(56,"Registering the satellite image to the map…");
  const metadataResponse=await fetchWithTimeout(
    metadataUrl,
    {mode:"cors"},
    Number(options.timeoutMs)||5200
  );
  if(!metadataResponse.ok){
    throw new Error(
      `Satellite metadata service returned ${metadataResponse.status}`
    );
  }

  const metadata=await metadataResponse.json();
  if(
    !metadata?.href||
    !metadata?.extent||
    !Number.isFinite(Number(metadata.extent.xmin))
  ){
    throw new Error("Satellite service returned no georeferenced image");
  }

  // ArcGIS may resize the exported extent to preserve image aspect ratio.
  // Always use the returned extent rather than the requested bbox.
  const actualBounds={
    xmin:Number(metadata.extent.xmin),
    ymin:Number(metadata.extent.ymin),
    xmax:Number(metadata.extent.xmax),
    ymax:Number(metadata.extent.ymax),
    spatialReference:
      metadata.extent.spatialReference||{wkid:3857}
  };

  onProgress(64,"Loading the registered original-color image…");
  const imageResponse=await fetchWithTimeout(
    metadata.href.replace(/^http:/,"https:"),
    {mode:"cors"},
    Number(options.timeoutMs)||5200
  );
  if(!imageResponse.ok){
    throw new Error(
      `Satellite image service returned ${imageResponse.status}`
    );
  }

  const blob=await imageResponse.blob();
  const bitmap=await createImageBitmap(blob);
  const canvas=document.createElement("canvas");
  canvas.width=analysisWidth;
  canvas.height=analysisHeight;
  const ctx=canvas.getContext(
    "2d",{willReadFrequently:true}
  );
  ctx.drawImage(
    bitmap,0,0,analysisWidth,analysisHeight
  );
  bitmap.close();

  const imageData=ctx.getImageData(
    0,0,analysisWidth,analysisHeight
  );
  onProgress(
    82,
    "Comparing court-line spacing ratios, rotations and color themes…"
  );

  let detected=detectCourtPolygonsFromPixels(
    imageData,
    c,
    actualBounds,
    analysisWidth,
    analysisHeight,
    {
      maxDistance:
        Number(options.maxDistance)||radiusMeters*1.08,
      distanceScale:
        Number(options.distanceScale)||
        Math.max(300,radiusMeters*.62),
      minComponentPixels:
        Number(options.minComponentPixels)||24,
      scoreThreshold:
        Number(options.scoreThreshold)||.51,
      referenceThreshold:
        Number(options.referenceThreshold)||.35,
      colorThemeThreshold:
        Number(options.colorThemeThreshold)||.46,
      strictReference:Boolean(options.strictReference),
      ratioThreshold:
        Number(options.ratioThreshold)||.34,
      selectionRatio:
        Number(options.selectionRatio)||.70,
      groupDistance:
        Number(options.groupDistance)||260,
      returnAllGroups:
        Boolean(options.returnAllGroups),
      maxGroups:Number(options.maxGroups)||12,
      maxCandidates:
        Number(options.maxCandidates)||
        Math.max(
          3,
          Math.min(10,Number(c.court_count)||5)
        )
    }
  );

  if(
    !detected.length&&
    options.standardWindowFallback!==false
  ){
    onProgress(
      89,
      "Scanning several crop scales for standard court-line ratios…"
    );
    const proposal=scanStandardCourtWindows(
      imageData,
      c,
      actualBounds,
      analysisWidth,
      analysisHeight,
      options
    );
    const threshold=
      Number(options.windowThreshold)||
      (options.strictReference?.62:.56);
    if(proposal&&proposal.score>=threshold){
      detected=[proposal.polygon];
    }
  }

  onProgress(
    93,
    detected.length
      ?"Court layout found — registering the overlay…"
      :"No confident court pattern yet…"
  );
  return detected;
}
async function preDetectCourtAreas(c,onProgress=()=>{},options={}){
  const force=Boolean(options.force);
  const cached=force?null:readPreDetectionCache(c);
  if(cached&&cached.length){
    onProgress(52,"Saved likely court areas loaded.");
    return cached;
  }
  const background=Boolean(options.background);
  const research=Boolean(options.research);
  onProgress(10,background
    ?"Running a high-accuracy background court scan…"
    :"Checking tennis-line reference patterns…"
  );
  const polygons=await detectCourtPolygonsFromSatellite(c,(percent,label)=>{
    const mapped=Math.round(10+(Math.max(58,percent)-58)*(42/35));
    onProgress(Math.min(52,mapped),label);
  },{
    radiusMeters:background?820:700,
    sourceSize:background?1280:640,
    analysisSize:background?640:320,
    timeoutMs:background?26000:3900,
    maxDistance:background?920:780,
    distanceScale:background?520:440,
    minComponentPixels:background?28:14,
    scoreThreshold:background?.63:.59,
    referenceThreshold:background?.52:.43,
    colorThemeThreshold:background?.62:.54,
    ratioThreshold:background?.50:.42,
    strictReference:true,
    candidateJoinDistance:background?135:120,
    minimumGroupScore:background?.55:.51,
    maxCandidates:Math.max(3,Math.min(12,Number(c.court_count)||6)),
    scanBudgetMs:background?900:620,
    angleStepDegrees:background?45:60,
    keepCandidates:background?16:10,
    refineSeeds:background?5:3
  });
  if(polygons.length)savePreDetectionCache(c,polygons);
  return polygons;
}
async function fetchWithTimeout(url,options={},timeoutMs=5500){
  const controller=new AbortController();
  const timer=window.setTimeout(()=>controller.abort(),timeoutMs);
  try{
    return await fetch(url,{...options,signal:controller.signal});
  }finally{
    clearTimeout(timer);
  }
}
async function fetchNearbyMappedTennisPolygons(c,onProgress=()=>{},options={}){
  const lat=Number(c.lat);
  const lng=Number(c.lng);
  const query=`[out:json][timeout:12];
(
  way(around:1100,${lat},${lng})["leisure"="pitch"]["sport"="tennis"];
  relation(around:1100,${lat},${lng})["leisure"="pitch"]["sport"="tennis"];
  way(around:1100,${lat},${lng})["leisure"="pitch"]["name"~"tennis",i];
  relation(around:1100,${lat},${lng})["leisure"="pitch"]["name"~"tennis",i];
);
out geom;`;

  const endpoints=[
    "https://overpass-api.de/api/interpreter",
    "https://overpass.kumi.systems/api/interpreter"
  ];
  const attempts=options.background?2:1;
  let lastError=null;

  for(let index=0;index<attempts;index++){
    onProgress(index===0?18:38,index===0
      ?"Checking mapped tennis-court geometry…"
      :"Trying another mapped-geometry source…"
    );
    try{
      const response=await fetchWithTimeout(endpoints[index],{
        method:"POST",
        headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},
        body:`data=${encodeURIComponent(query)}`
      },options.background?12000:2800);

      if(!response.ok){
        throw new Error(`Court geometry service returned ${response.status}`);
      }

      const data=await response.json();
      const polygons=parseOverpassPolygons(data);
      if(polygons.length)return polygons;
    }catch(error){
      lastError=error;
    }
  }

  if(lastError&& !options.background)console.warn(lastError);
  return [];
}
async function resolveCourtFootprints(c,onProgress=()=>{},options={}){
  const force=Boolean(options.force);
  const cached=force?null:readFootprintCache(c);
  if(cached&&cached.polygons.length){
    onProgress(100,"Saved court outline loaded.");
    return cached;
  }
  const background=Boolean(options.background);
  const research=Boolean(options.research);
  const deadlineMs=background?30000:5800;
  const savedVisual=force?null:readPreDetectionCache(c);
  let visualCandidates=savedVisual||[];
  if(visualCandidates.length&&typeof options.onCandidates==="function"){
    options.onCandidates(visualCandidates);
  }
  const mappedRawPromise=fetchNearbyMappedTennisPolygons(c,(percent,label)=>{
    onProgress(Math.min(48,percent),label);
  },{background});
  const visualPromise=savedVisual
    ?Promise.resolve(savedVisual)
    :preDetectCourtAreas(c,(percent,label)=>{
      onProgress(Math.max(12,Math.min(72,percent)),label);
    },{background,research,force});
  visualPromise.then(polygons=>{
    if(polygons&&polygons.length){
      visualCandidates=polygons;
      if(typeof options.onCandidates==="function")options.onCandidates(polygons);
    }
  }).catch(()=>{});
  if(background){
    const timeout=new Promise(resolve=>{
      window.setTimeout(()=>resolve({timedOut:true,mapped:[],visual:[]}),deadlineMs);
    });
    const completed=Promise.all([
      mappedRawPromise.catch(()=>[]),
      visualPromise.catch(()=>[])
    ]).then(([mapped,visual])=>({timedOut:false,mapped,visual}));
    const result=await Promise.race([completed,timeout]);
    const chosenMapped=chooseFacilityCourtPolygons(c,result.mapped||[],result.visual||[]);
    if(chosenMapped.length){
      saveFootprintCache(c,chosenMapped,"OpenStreetMap court polygons");
      onProgress(100,"High-confidence mapped courts cached.");
      return {polygons:chosenMapped,source:"mapped"};
    }
    if(result.visual&&result.visual.length){
      saveFootprintCache(c,result.visual,"strict multi-reference satellite detection");
      onProgress(100,"High-confidence visual courts cached.");
      return {polygons:result.visual,source:"satellite-reference-strict"};
    }
    return {polygons:[],source:result.timedOut?"timeout":"none"};
  }
  const mappedReliable=mappedRawPromise.then(raw=>{
    const chosen=chooseFacilityCourtPolygons(c,raw,visualCandidates);
    if(!chosen.length)throw new Error("No reliable mapped court group");
    return {polygons:chosen,source:"mapped"};
  });
  const visualReliable=visualPromise.then(polygons=>{
    if(!polygons||!polygons.length)throw new Error("No reliable reference-matched court group");
    return {polygons,source:"satellite-reference"};
  });
  const timeoutResult=new Promise(resolve=>window.setTimeout(()=>resolve({polygons:[],source:"timeout"}),deadlineMs));
  const reliableResult=Promise.any([mappedReliable,visualReliable]).catch(()=>({polygons:[],source:"none"}));
  const result=await Promise.race([reliableResult,timeoutResult]);
  if(result.polygons&&result.polygons.length){
    saveFootprintCache(c,result.polygons,result.source==="mapped"?"OpenStreetMap court polygons":"multi-reference satellite detection");
    onProgress(100,result.source==="mapped"?"Mapped court complex loaded.":"Reference-matched court complex loaded.");
  }
  mappedReliable.then(mapped=>saveFootprintCache(c,mapped.polygons,"OpenStreetMap court polygons")).catch(()=>{});
  return result;
}

  },260);

  let result={polygons:[],source:"none"};
  try{
    result=await resolveCourtFootprints(
      c,
      (percent,label)=>{
        if(
          token!==footprintRequestToken||
          selectedCourtId!==c.id
        )return;
        shownProgress=Math.max(shownProgress,percent);
        detectionProgress(shownProgress,label);
      },
      {
        background:false,
        onCandidates:()=>{}
      }
    );
  }catch(error){
    console.warn("Court-layout attempt failed",error);
    result={polygons:[],source:"error"};
  }finally{
    clearInterval(ticker);
  }

  if(
    token!==footprintRequestToken||
    selectedCourtId!==c.id
  )return;

  const polygons=result.polygons||[];
  if(polygons.length){
    snapMarkerToMappedCourts(
      c,polygons,result.source
    );
    transitionToDetectedCourts(polygons);
    const bounds=polygonsBounds(
      expandCourtArea(polygons,3)
    );
    if(bounds&&bounds.isValid()){
      map.fitBounds(bounds.pad(.42),{
        padding:[42,42],
        maxZoom:19,
        animate:true
      });
    }
    detectionProgress(
      100,
      "Confident court layout highlighted.",
      "complete"
    );
    hideDetectionProgress(650);
  }else{
    courtOutlineLayer?.clearLayers();
    selectedCourtPolygons=[];
    document.getElementById("map").classList.remove(
      "court-footprint-active"
    );
    detectionProgress(
      100,
      result.source==="timeout"
        ?"Layout scan reached its time limit — facility pin remains available."
        :"No confident court layout found — use the full-color map and facility pin.",
      "warning"
    );
    hideDetectionProgress(1500);
  }
}

function createMap(){
  if(!window.L){
    document.querySelector("#mapError h2").textContent="The map library did not load";
    document.querySelector("#mapError p").textContent="The court list and Google Maps links still work. Check the internet connection and reload the page.";
    return false;
  }

  map=L.map("map",{preferCanvas:true,zoomControl:true}).setView([34.02,-118.25],9);

  const imageryUrl="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";

  map.createPane("baseSatellitePane");
  const basePane=map.getPane("baseSatellitePane");
  basePane.classList.add("leaflet-base-satellite-pane");
  basePane.style.zIndex="200";

  map.createPane("areaColorPane");
  areaColorPane=map.getPane("areaColorPane");
  areaColorPane.classList.add("leaflet-area-color-pane");
  areaColorPane.style.zIndex="245";
  areaColorPane.style.opacity="0";

  map.createPane("courtColorPane");
  courtColorPane=map.getPane("courtColorPane");
  courtColorPane.classList.add("leaflet-court-color-pane");
  courtColorPane.style.zIndex="250";
  courtColorPane.style.opacity="0";

  const imageryOptions={
    maxZoom:19,
    maxNativeZoom:19,
    updateWhenIdle:true,
    keepBuffer:2,
    crossOrigin:true,
    attribution:"Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community"
  };

  L.tileLayer(imageryUrl,{...imageryOptions,pane:"baseSatellitePane"}).addTo(map);

  const CourtColorLayer=L.GridLayer.extend({
    initialize(options){
      L.setOptions(this,options);
      this._polygons=[];
      this._imageryUrl=imageryUrl;
    },
    setPolygons(polygons){
      this._polygons=Array.isArray(polygons)?polygons:[];
      this.redraw();
      return this;
    },
    createTile(coords,done){
      const tile=document.createElement("canvas");
      const size=this.getTileSize();
      tile.width=size.x;
      tile.height=size.y;
      tile.setAttribute("role","presentation");

      const polygons=this._polygons;
      if(!polygons.length){
        window.setTimeout(()=>done(null,tile),0);
        return tile;
      }

      const image=new Image();
      image.crossOrigin="anonymous";
      image.decoding="async";
      image.onload=()=>{
        try{
          const ctx=tile.getContext("2d");
          const origin=L.point(coords.x*size.x,coords.y*size.y);

          ctx.save();
          ctx.beginPath();

          for(const polygon of polygons){
            if(!polygon||polygon.length<3)continue;
            let started=false;

            for(const pair of polygon){
              const projected=this._map.project(L.latLng(pair[0],pair[1]),coords.z).subtract(origin);
              if(!started){
                ctx.moveTo(projected.x,projected.y);
                started=true;
              }else{
                ctx.lineTo(projected.x,projected.y);
              }
            }

            if(started)ctx.closePath();
          }

          ctx.clip();
          ctx.drawImage(image,0,0,size.x,size.y);
          ctx.restore();
          done(null,tile);
        }catch(error){
          done(error,tile);
        }
      };
      image.onerror=()=>done(new Error("Satellite tile failed"),tile);
      image.src=this._imageryUrl
        .replace("{z}",String(coords.z))
        .replace("{x}",String(coords.x))
        .replace("{y}",String(coords.y));

      return tile;
    }
  });

  areaColorLayer=new CourtColorLayer({
    pane:"areaColorPane",
    tileSize:256,
    maxZoom:19,
    maxNativeZoom:19,
    updateWhenIdle:true,
    keepBuffer:1,
    opacity:1
  });

  courtColorLayer=new CourtColorLayer({
    pane:"courtColorPane",
    tileSize:256,
    maxZoom:19,
    maxNativeZoom:19,
    updateWhenIdle:true,
    keepBuffer:1,
    opacity:1
  });

  courtOutlineLayer=L.layerGroup().addTo(map);
  manualAreaOutlineLayer=L.layerGroup().addTo(map);
  areaIndexLayer=L.layerGroup().addTo(map);

  for(const category of ["pay","open","club"]){
    layers.category[category]=clusterGroup(clusterIcon(category));
  }
  layers.all=clusterGroup(combinedClusterIcon);
  layers.off=L.layerGroup();

  map.on("popupopen",event=>{
    const element=event.popup.getElement();
    if(element)wireCorrectionButtons(element);
  });
  document.getElementById("mapError").classList.add("hidden");
  return true;
}

function courtComplexCentroid(polygons){
  const centers=(polygons||[])
    .filter(poly=>Array.isArray(poly)&&poly.length>=3)
    .map(polygonCentroid);
  if(!centers.length)return null;
  return {
    lat:centers.reduce((sum,p)=>sum+p.lat,0)/centers.length,
    lng:centers.reduce((sum,p)=>sum+p.lng,0)/centers.length
  };
}
function snapMarkerToMappedCourts(c,polygons,source){

    lat:Number(c.lat),
    lng:Number(c.lng)
  };
  if(haversineMeters(original,center)>1500)return;

  saveMappedCourtCenter(c,center);

  if(marker)marker.setLatLng([center.lat,center.lng]);

function rebuildMapLayers(){

  if(mode==="category"){

      const group=layers.category[category];
      group.clearLayers();

function nearestKnownCourt(point,known,usedIds){
  let best=null;
  let bestDistance=Infinity;

  for(const court of known){
    if(usedIds.has(court.id))continue;
    const distance=haversineMeters(point,{
      lat:Number(court.lat),lng:Number(court.lng)
    });
    if(distance<bestDistance){
      bestDistance=distance;
      best=court;
    }
  }

  return bestDistance<=420?best:null;
