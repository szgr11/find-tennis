<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="application-build" content="weather-courtfinder-v17-map-focus">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>LA Tennis Court Finder</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">

<style>
:root{
  --bg:#171714;
  --surface:#24221f;
  --surface-2:#2d2a27;
  --surface-3:#35312d;
  --line:#514d47;
  --text:#f3f1ed;
  --muted:#aaa59e;
  --lime:#c9f13f;
  --lime-soft:#e2f89b;
  --green:#28a66c;
  --green-deep:#16774d;
  --pay:#d89538;
  --open:#4ca66c;
  --club:#9d82dc;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --ui:"Manrope",system-ui,sans-serif;
  --serif:"Source Serif 4",Georgia,serif;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--ui)}
button,input,select{font:inherit}
button,a{touch-action:manipulation}
[hidden]{display:none!important}

/* Launch slideshow */
.launch{
  position:fixed;
  inset:0;
  z-index:5000;
  display:grid;
  place-items:center;
  padding:24px;
  background:
    radial-gradient(circle at 50% 16%,rgba(201,241,63,.09),transparent 34%),
    #171714;
  transition:opacity .28s ease,visibility .28s ease;
}
.launch.closing{opacity:0;visibility:hidden;pointer-events:none}
.launch-card{
  width:min(760px,100%);
  overflow:hidden;
  border:1px solid #57534d;
  border-radius:22px;
  background:var(--surface);
  box-shadow:0 30px 90px rgba(0,0,0,.5);
}
.launch-slides{
  position:relative;
  aspect-ratio:16/9;
  overflow:hidden;
  background:#111;
}
.launch-slide{
  position:absolute;
  inset:0;
  opacity:0;
  transform:scale(1.025);
  background-position:center;
  background-repeat:no-repeat;
  background-size:cover;
  transition:opacity .55s ease,transform 1.5s ease;
}
.launch-slide.active{opacity:1;transform:scale(1)}
.launch-slides::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.05),rgba(0,0,0,.72));
}
.launch-caption{
  position:absolute;
  left:20px;
  bottom:15px;
  z-index:2;
  color:#d9d5ce;
  font-family:var(--serif);
  font-size:12px;
}
.launch-copy{padding:19px 21px 20px}
.launch-kicker{
  color:var(--lime);
  font-family:var(--display);
  font-size:12px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.launch h1{
  margin:3px 0 6px;
  font-family:var(--display);
  font-size:36px;
  line-height:.98;
  letter-spacing:.01em;
}
.launch p{
  max-width:630px;
  margin:0;
  color:#b7b2aa;
  font-family:var(--serif);
  font-size:13px;
  line-height:1.5;
}
.launch-track{
  height:5px;
  margin-top:16px;
  overflow:hidden;
  border-radius:999px;
  background:#49453f;
}
.launch-fill{
  width:8%;
  height:100%;
  border-radius:inherit;
  background:linear-gradient(90deg,var(--green),var(--lime));
  transition:width .22s ease;
}
.launch-meta{
  display:flex;
  justify-content:space-between;
  gap:14px;
  margin-top:8px;
  color:#918c85;
  font-size:9px;
  font-weight:650;
}

/* Main layout */
.app{
  display:grid;
  grid-template-rows:64px minmax(0,1fr);
  width:100%;
  height:100%;
}
.topbar{
  display:grid;
  grid-template-columns:auto minmax(220px,1fr) 190px auto auto;
  gap:10px;
  align-items:center;
  padding:10px 14px;
  border-bottom:1px solid #403d38;
  background:#191815;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  white-space:nowrap;
  font-family:var(--display);
  font-size:24px;
  font-weight:800;
  letter-spacing:.02em;
  text-transform:uppercase;
}
.brand-ball{
  width:20px;
  height:20px;
  border:2px solid rgba(255,255,255,.62);
  border-radius:50%;
  background:var(--lime);
}
.input,.select,.button{
  min-height:42px;
  border:1px solid #4d4943;
  border-radius:11px;
  background:#292724;
  color:var(--text);
}
.input{
  width:100%;
  padding:0 14px;
  outline:none;
}
.input:focus,.select:focus{border-color:var(--lime);box-shadow:0 0 0 2px rgba(201,241,63,.12)}
.select{padding:0 12px}
.button{
  padding:0 14px;
  font-weight:750;
  cursor:pointer;
}
.button:hover{background:#37332f}
.button.primary{border-color:var(--lime);background:var(--lime);color:#171914}

.workspace{
  display:grid;
  grid-template-columns:390px minmax(0,1fr);
  min-height:0;
}
.sidebar{
  display:grid;
  grid-template-rows:auto auto minmax(0,1fr);
  min-height:0;
  border-right:1px solid #44413c;
  background:#22201d;
}
.filters{
  display:grid;
  gap:10px;
  padding:13px;
  border-bottom:1px solid #44413c;
}
.category-row{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
}
.category-toggle{
  min-height:34px;
  padding:0 12px;
  border:1px solid #504c46;
  border-radius:999px;
  background:#2c2926;
  color:#d8d4ce;
  font-size:10px;
  font-weight:750;
  cursor:pointer;
}
.category-toggle[aria-pressed="false"]{opacity:.38}
.category-dot{
  display:inline-block;
  width:8px;
  height:8px;
  margin-right:6px;
  border-radius:50%;
}
.filter-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.near-row{
  display:grid;
  grid-template-columns:1fr 108px;
  gap:8px;
}
.status{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 13px;
  border-bottom:1px solid #44413c;
  color:#9f9a93;
  font-size:9px;
}
.status strong{color:#e8e5df}
.list{
  min-height:0;
  overflow:auto;
  padding:10px;
}
.card{
  margin-bottom:9px;
  padding:12px;
  border:1px solid #494641;
  border-left:4px solid var(--card-color,#777);
  border-radius:13px;
  background:#2a2825;
}
.card h2{
  margin:0 0 5px;
  font-family:var(--display);
  font-size:19px;
  line-height:1.05;
  letter-spacing:.01em;
}
.card-address{
  color:#aaa59e;
  font-family:var(--serif);
  font-size:10.5px;
  line-height:1.45;
}
.tags{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:9px;
}
.tag{
  padding:4px 7px;
  border:1px solid #514d47;
  border-radius:999px;
  background:#302d2a;
  color:#d2cec7;
  font-size:8px;
  font-weight:750;
  letter-spacing:.045em;
  text-transform:uppercase;
}
.tag.mapped{border-color:rgba(76,166,108,.72);color:#b8e4c6}
.card-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:10px;
}
.card-actions button,.card-actions a{
  min-height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 9px;
  border:1px solid #57534d;
  border-radius:9px;
  background:#302d2a;
  color:#ece9e4;
  text-decoration:none;
  font-size:9px;
  font-weight:750;
  cursor:pointer;
}
.card-actions .show-map{grid-column:1/-1}
.card-actions .directions{
  border-color:var(--lime);
  background:var(--lime);
  color:#171914;
}
.card-actions .court-info{
  border-color:var(--green);
  background:rgba(40,166,108,.13);
  color:#c9ecd8;
}
.card-actions .disabled{opacity:.42;pointer-events:none}

/* Map and drawer */
.map-pane{
  position:relative;
  min-width:0;
  min-height:0;
  background:#1d1d1a;
}
#map{
  position:absolute;
  inset:0;
  transition:right .2s ease,bottom .2s ease;
}
.map-pane.drawer-open #map{right:360px}
.drawer{
  position:absolute;
  z-index:900;
  top:0;
  right:0;
  bottom:0;
  width:360px;
  overflow:auto;
  border-left:1px solid #4b4842;
  background:#24221f;
  box-shadow:-12px 0 28px rgba(0,0,0,.25);
}
.drawer-close{
  position:sticky;
  top:9px;
  z-index:8;
  float:right;
  margin:9px 9px -40px 0;
  min-height:31px;
  padding:0 11px;
  border:1px solid #5d5952;
  border-radius:999px;
  background:rgba(28,27,24,.94);
  color:#eeeae5;
  font-size:8px;
  font-weight:750;
  cursor:pointer;
}
.facility-photo{
  position:relative;
  height:170px;
  overflow:hidden;
  background:#1b1a18;
}
.facility-photo img{width:100%;height:100%;object-fit:cover;display:block}
.facility-photo::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,rgba(0,0,0,.02) 25%,rgba(0,0,0,.79));
}
.facility-title{
  position:absolute;
  z-index:2;
  left:17px;
  right:70px;
  bottom:15px;
  font-family:var(--display);
  font-size:30px;
  line-height:.96;
  letter-spacing:.01em;
}
.drawer-body{display:grid;gap:10px;padding:12px}
.info-block,.weather-card,.activity-card{
  border:1px solid #504c46;
  border-radius:14px;
  background:#2c2926;
}
.info-block{padding:11px 12px}
.eyebrow{
  color:#8f8a82;
  font-family:var(--display);
  font-size:10px;
  font-weight:750;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.info-value{
  margin-top:4px;
  color:#ddd9d2;
  font-family:var(--serif);
  font-size:11px;
  line-height:1.5;
}
.fact-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:7px;
}
.fact{
  min-width:0;
  padding:10px 6px;
  border:1px solid #504c46;
  border-radius:12px;
  background:#2c2926;
  text-align:center;
}
.fact span{
  display:block;
  color:#8d8880;
  font-family:var(--display);
  font-size:9px;
  font-weight:750;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.fact strong{
  min-height:2.45em;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:5px;
  overflow-wrap:anywhere;
  color:#f0ede8;
  font-size:10px;
  line-height:1.22;
}
.primary-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.primary-actions .show-map-main{
  grid-column:1/-1;
}
.primary-actions a{
  min-height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 10px;
  border-radius:11px;
  text-align:center;
  text-decoration:none;
  font-size:10px;
  font-weight:800;
}
.show-map-main{
  min-height:41px;
  border:1px solid #68625a;
  background:#38342f;
  color:#f1ede7;
  cursor:pointer;
}
.show-map-main:hover{
  border-color:var(--lime);
  color:var(--lime-soft);
}
.directions-main{
  border:1px solid var(--lime);
  background:var(--lime);
  color:#171914;
}
.info-main{
  border:1px solid var(--green);
  background:var(--green);
  color:#fff;
}
.info-main.disabled{opacity:.4;pointer-events:none}

.weather-card{padding:12px}
.weather-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:flex-start;
}
.weather-title{
  font-family:var(--display);
  font-size:21px;
  line-height:1;
}
.weather-source{color:#716d67;font-size:7.5px}
.weather-controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:10px;
}
.weather-controls select{
  width:100%;
  min-width:0;
  min-height:35px;
  padding:0 8px;
  border:1px solid #55514b;
  border-radius:9px;
  background:#35312d;
  color:#eeeae5;
  font-size:9px;
}
.weather-hero{
  display:grid;
  grid-template-columns:auto 1fr;
  gap:12px;
  align-items:center;
  margin-top:12px;
  padding:11px;
  border-radius:11px;
  background:#34302c;
}
.weather-temp{
  font-family:var(--display);
  font-size:38px;
  line-height:.9;
}
.weather-condition{
  font-family:var(--display);
  font-size:16px;
  line-height:1;
}
.weather-play{
  margin-top:4px;
  color:var(--lime-soft);
  font-family:var(--serif);
  font-size:10px;
}
.weather-metrics{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
  margin-top:8px;
}
.weather-metric{
  min-width:0;
  padding:8px 5px;
  border:1px solid #4d4943;
  border-radius:9px;
  background:#302d2a;
  text-align:center;
}
.weather-metric span{
  display:block;
  color:#858078;
  font-family:var(--display);
  font-size:8px;
  letter-spacing:.07em;
  text-transform:uppercase;
}
.weather-metric strong{
  display:block;
  margin-top:3px;
  overflow-wrap:anywhere;
  font-size:9px;
}
.day-summary{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:6px;
  margin-top:8px;
}
.day-summary div{
  padding:8px;
  border-radius:9px;
  background:#302d2a;
  color:#aaa59e;
  font-family:var(--serif);
  font-size:9px;
  line-height:1.45;
}
.best-title{
  margin-top:11px;
  color:#d8d4ce;
  font-family:var(--display);
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.best-windows{
  display:flex;
  gap:6px;
  margin-top:7px;
  overflow:auto;
  padding-bottom:2px;
}
.best-window{
  flex:0 0 auto;
  padding:7px 9px;
  border:1px solid rgba(201,241,63,.34);
  border-radius:9px;
  background:rgba(201,241,63,.07);
  color:#dceca6;
  font-size:8px;
  line-height:1.35;
}

.activity-card{padding:12px}
.activity-card h3{
  margin:4px 0 4px;
  font-family:var(--display);
  font-size:20px;
}
.activity-card p{
  margin:0;
  color:#aaa59e;
  font-family:var(--serif);
  font-size:10px;
  line-height:1.5;
}
.activity-link{
  min-height:41px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:10px;
  border:1px solid #6a6258;
  border-radius:10px;
  background:#37322d;
  color:#eee9e2;
  text-decoration:none;
  font-size:9px;
  font-weight:800;
}
.activity-link:hover{border-color:var(--lime);color:var(--lime-soft)}

.leaflet-control-zoom a{
  background:#292724!important;
  color:#eeeae5!important;
  border-color:#4a4640!important;
}
.marker-dot{
  width:16px;
  height:16px;
  border:3px solid #fff;
  border-radius:50%;
  box-shadow:0 2px 8px rgba(0,0,0,.48);
}
.toast{
  position:absolute;
  z-index:1000;
  left:14px;
  bottom:14px;
  max-width:min(380px,calc(100% - 28px));
  padding:9px 11px;
  border:1px solid #5a5650;
  border-radius:10px;
  background:rgba(35,33,30,.95);
  color:#e8e4de;
  font-size:9px;
  box-shadow:0 7px 24px rgba(0,0,0,.3);
}

@media(max-width:980px){
  .topbar{grid-template-columns:auto minmax(180px,1fr) 160px auto}
  .topbar .share-button{display:none}
  .workspace{grid-template-columns:340px minmax(0,1fr)}
  .map-pane.drawer-open #map{right:330px}
  .drawer{width:330px}
}
@media(max-width:760px){
  .app{grid-template-rows:auto minmax(0,1fr)}
  .topbar{
    grid-template-columns:1fr auto;
    padding:9px;
  }
  .brand{font-size:20px}
  .topbar .input{grid-column:1/-1}
  .topbar .select{display:none}
  .workspace{
    grid-template-columns:1fr;
    grid-template-rows:minmax(0,1fr);
  }
  .sidebar{
    position:absolute;
    z-index:850;
    left:8px;
    top:8px;
    bottom:8px;
    width:min(330px,calc(100vw - 16px));
    transform:translateX(calc(-100% - 16px));
    transition:transform .2s ease;
    box-shadow:0 16px 42px rgba(0,0,0,.42);
  }
  .sidebar.open{transform:translateX(0)}
  .mobile-menu{display:block!important}
  .map-pane{grid-row:1}
  .drawer{
    top:auto;
    left:0;
    width:auto;
    height:min(58vh,520px);
    border-left:0;
    border-top:1px solid #4b4842;
  }
  .map-pane.drawer-open #map{right:0;bottom:min(58vh,520px)}
  .facility-photo{height:120px}
  .weather-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* Build 15 — original category clusters and refined typography */
.marker-dot{
  width:16px;
  height:16px;
  border:3px solid #fff;
  border-radius:50%;
  box-shadow:
    0 2px 9px rgba(0,0,0,.48),
    0 0 0 1px rgba(0,0,0,.16);
}
.category-cluster{
  display:flex;
  align-items:center;
  justify-content:center;
  width:38px;
  height:38px;
  border:3px solid rgba(255,255,255,.78);
  border-radius:50%;
  color:#fff;
  font-family:var(--ui);
  font-size:11px;
  font-weight:800;
  letter-spacing:-.02em;
  box-shadow:
    0 4px 15px rgba(0,0,0,.38),
    0 0 0 5px rgba(255,255,255,.10);
}
.category-cluster.pay{background:#d55e00}
.category-cluster.open{background:#1777a7}
.category-cluster.club{background:#7b4ab5}

body,
button,
input,
select,
.card-address,
.info-value,
.facility-address-value,
.weather-metric strong,
.day-summary div{
  font-family:var(--ui);
}
.brand,
.card h2,
.facility-title,
.weather-title,
.weather-condition,
.activity-card h3,
.launch h1,
.eyebrow,
.fact span,
.weather-metric span,
.best-title{
  font-family:var(--display);
}
.launch p,
.activity-card p,
.weather-play{
  font-family:var(--serif);
}
.card h2{
  font-size:20px;
  font-weight:700;
  letter-spacing:.008em;
}
.card-address{
  color:#aaa69f;
  font-size:10px;
  font-weight:500;
  line-height:1.45;
}
.tag{
  font-family:var(--ui);
  font-size:8px;
  font-weight:750;
  letter-spacing:.04em;
}
.button,
.card-actions button,
.card-actions a,
.primary-actions a,
.primary-actions button,
.activity-link{
  font-family:var(--ui);
  font-weight:750;
  letter-spacing:-.012em;
}
.info-value{
  font-size:11px;
  font-weight:500;
}
.facility-title{
  font-size:30px;
  font-weight:700;
}
.weather-title{
  font-size:23px;
  font-weight:700;
}


/* Build 16 — mobile interaction layer */
:root{
  --mobile-header-height:112px;
}
.mobile-sheet-header,
.mobile-area-field,
.mobile-backdrop,
.drawer-handle{
  display:none;
}

@media(max-width:900px){
  html,
  body{
    height:100%;
    height:100dvh;
  }

  .app{
    height:100%;
    height:100dvh;
  }

  .topbar{
    grid-template-columns:minmax(0,1fr) auto auto;
    grid-template-rows:auto auto;
    gap:8px;
    min-height:0;
    padding:
      max(8px,env(safe-area-inset-top))
      10px
      9px;
  }

/* Build 17 — close map focus */
#map .leaflet-tile-pane{
  filter:saturate(1.08) contrast(1.06) brightness(1.02);
}
.map-focus-ring{
  pointer-events:none;
}
.map-focus-ring::before,
.map-focus-ring::after{
  content:"";
  position:absolute;
  inset:0;
  border:2px solid var(--lime);
  border-radius:50%;
  animation:mapFocusPulse 1.35s ease-out forwards;
}
.map-focus-ring::after{
  animation-delay:.18s;
}
@keyframes mapFocusPulse{
  0%{
    opacity:.95;
    transform:scale(.35);
  }
  100%{
    opacity:0;
    transform:scale(2.8);
  }
}
.map-focus-label{

  border:1px solid rgba(255,255,255,.28);

<div id="launch" class="launch">
  <section class="launch-card">
    <div id="launchSlides" class="launch-slides"></div>
    <div class="launch-copy">
      <div class="launch-kicker">LA court map · Build 17</div>
      <h1>Finding tennis courts</h1>
      <p>Mapping public courts, open-play facilities, and clubs across Los Angeles while local court details become available.</p>
      <div class="launch-track"><div id="launchFill" class="launch-fill"></div></div>
      <div class="launch-meta">
        <span id="launchStatus">Starting facility map...</span>
        <span id="launchPercent">8%</span>
      </div>
    </div>
  </section>
</div>

<div class="app">
  <header class="topbar">
    <div class="brand"><span class="brand-ball"></span>LA Tennis Court Finder</div>
    <input id="search" class="input" type="search" placeholder="Search court, park, city, or address">
    <select id="city" class="select"><option value="">All areas</option></select>
    <button id="locate" class="button" type="button">Locate me</button>
    <button id="mobileMenu" class="button mobile-menu" type="button" hidden aria-controls="sidebar" aria-expanded="false">Courts</button>
  </header>

  <main class="workspace">
    <button
      id="mobileBackdrop"
      class="mobile-backdrop"
      type="button"
      aria-label="Close court list"
      hidden
    ></button>

    <aside id="sidebar" class="sidebar" aria-label="Court filters and results">
      <div class="mobile-sheet-header">
        <div>
          <div class="mobile-sheet-kicker">Court finder</div>
          <div class="mobile-sheet-title">Browse courts</div>
        </div>
        <button id="mobileSidebarClose" class="mobile-sheet-close" type="button">Close</button>
      </div>
      <section class="filters">
        <label class="mobile-area-field">
          <span>Area</span>
          <select id="cityMobile" class="select">
            <option value="">All areas</option>
          </select>
        </label>

        <div class="category-row">
          <button class="category-toggle" data-category="pay" aria-pressed="true"><span class="category-dot" style="background:var(--pay)"></span>Pay courts</button>
          <button class="category-toggle" data-category="open" aria-pressed="true"><span class="category-dot" style="background:var(--open)"></span>Open play</button>
          <button class="category-toggle" data-category="club" aria-pressed="true"><span class="category-dot" style="background:var(--club)"></span>Clubs</button>
        </div>

        <div class="filter-grid">
          <select id="lights" class="select">
            <option value="">Any lighting</option>
            <option value="yes">Lights</option>
            <option value="no">No lights</option>
            <option value="unknown">Lights unknown</option>
          </select>
          <select id="sort" class="select">
            <option value="name">Sort by name</option>
            <option value="distance">Sort by distance</option>
            <option value="courts">Sort by court count</option>
          </select>
        </div>

        <div class="near-row">
          <button id="nearby" class="button primary" type="button">Find courts near me</button>
          <select id="radius" class="select">
            <option value="3">3 miles</option>
            <option value="5" selected>5 miles</option>
            <option value="10">10 miles</option>
            <option value="20">20 miles</option>
          </select>
        </div>
      </section>

      <div class="status">
        <span id="mappingStatus"><strong>10/165 mapped</strong></span>
        <span id="visibleStatus">165 shown</span>
      </div>

      <section id="list" class="list"></section>
    </aside>

    <section id="mapPane" class="map-pane">
      <div id="map"></div>
      <aside id="drawer" class="drawer" hidden aria-label="Facility details">
        <div class="drawer-handle" aria-hidden="true"></div>
        <button id="drawerClose" class="drawer-close" type="button">Close</button>
        <div id="drawerContent"></div>
      </aside>
      <div id="toast" class="toast" hidden></div>
    </section>
  </main>
</div>

function esc(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}
function validPoint(lat,lng){
  return (
    Number.isFinite(lat)&&
    Number.isFinite(lng)&&
    lat>32.8&&lat<35&&
    lng>-119.2&&lng<-117.3
  );
}
function numberOrNull(value){
  if(
    value===null||
    value===undefined||
    String(value).trim()===""
  ){
    return null;
  }
  const number=Number(value);
  return Number.isFinite(number)?number:null;
}
function hasPoint(c){
  const lat=numberOrNull(c.lat);
  const lng=numberOrNull(c.lng);
  return lat!==null&&lng!==null&&validPoint(lat,lng);
}
function categoryColor(category){
  return CATEGORY_COLORS[category]||"#777";
}
function categoryLabel(category){
  return CATEGORY_LABELS[category]||"Court";
}
function courtCountLabel(c){
  const count=Number(c.court_count);
  return Number.isFinite(count)&&count>0
    ?`${count} court${count===1?"":"s"}`
    :"Count unknown";
}
function lightsLabel(value){
  if(value==="yes")return "Lights";
  if(value==="no")return "No lights";
  return "Lights unknown";
}
function formatPhone(value){
  return String(value||"").trim();
}
function mapsUrl(c){
  return c.directions_url||
    "https://www.google.com/maps/search/?api=1&query="+
    encodeURIComponent(`${c.name}, ${c.address}`);
}
function distanceMiles(a,b){
  const radius=3958.7613;
  const toRadians=value=>value*Math.PI/180;
  const deltaLat=toRadians(b.lat-a.lat);
  const deltaLng=toRadians(b.lng-a.lng);
  const lat1=toRadians(a.lat);
  const lat2=toRadians(b.lat);
  const h=
    Math.sin(deltaLat/2)**2+
    Math.cos(lat1)*Math.cos(lat2)*
    Math.sin(deltaLng/2)**2;
  return 2*radius*Math.asin(Math.sqrt(h));
}
function showToast(message){
  const toast=document.getElementById("toast");
  toast.textContent=message;
  toast.hidden=false;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{toast.hidden=true},2600);
}
function scheduleRender(){
  if(renderTimer)return;
  renderTimer=setTimeout(()=>{
    renderTimer=null;
    renderAll();
  },350);
}

/* Launch slideshow */
function buildSlides(){
  const shell=document.getElementById("launchSlides");
  shell.innerHTML=SLIDES.map((slide,index)=>`
    <div
      class="launch-slide ${index===0?"active":""}"
      style="background-image:url('${slide.src}')"
      aria-hidden="true"
    ></div>
  `).join("")+`<div id="launchCaption" class="launch-caption">${esc(SLIDES[0]?.caption||"Aerial tennis courts")}</div>`;
}
function rotateSlide(){
  const images=[...document.querySelectorAll(".launch-slide")];
  if(!images.length)return;
  images[slideIndex]?.classList.remove("active");
  slideIndex=(slideIndex+1)%images.length;
  images[slideIndex]?.classList.add("active");
  document.getElementById("launchCaption").textContent=
    SLIDES[slideIndex]?.caption||"Aerial tennis courts";
}
function updateLaunchProgress(startedAt){
  const elapsed=Date.now()-startedAt;
  const timeProgress=Math.min(1,elapsed/3400);
  const mapped=COURTS.filter(hasPoint).length;
  const mappingProgress=Math.min(1,mapped/Math.max(34,COURTS.length*.72));
  const progress=Math.round(
    8+84*Math.max(
      timeProgress*.86,
      mappingProgress*.92
    )
  );
  document.getElementById("launchFill").style.width=`${Math.min(96,progress)}%`;
  document.getElementById("launchPercent").textContent=`${Math.min(96,progress)}%`;
  document.getElementById("launchStatus").textContent=
    `Mapped ${mapped} of ${COURTS.length} facilities`;
}
async function runLaunch(){
  buildSlides();
  const startedAt=Date.now();
  slideTimer=setInterval(rotateSlide,850);
  const progressTimer=setInterval(()=>updateLaunchProgress(startedAt),180);

  await new Promise(resolve=>setTimeout(resolve,4300));

  clearInterval(progressTimer);
  clearInterval(slideTimer);
  document.getElementById("launchFill").style.width="100%";
  document.getElementById("launchPercent").textContent="100%";
  document.getElementById("launchStatus").textContent="Court map ready";

  await new Promise(resolve=>setTimeout(resolve,180));
  const launch=document.getElementById("launch");
  launch.classList.add("closing");
  setTimeout(()=>launch.remove(),300);
  map.invalidateSize({pan:false});
}

/* Coordinate cache and background geocoding */
function normalizeAddress(c){
  return String(c.address||"")
    .toLowerCase()
    .replace(/\s+/g," ")
    .trim();
}
function cacheCandidates(c){
  const address=normalizeAddress(c);
  return [
    `la-tennis-category-v15:${c.id}`,
    `la-tennis-fast-v1:${c.id}`,
    `la-tennis-exact-v3:${c.id}`,
    `la-tennis-exact-v2:${c.id}`,
    `la-tennis-exact-v1:${c.id}`,
    `precise-v3:${address}`,
    `geo:${address}`
  ];
}
function parseCoordinateCache(raw){
  if(!raw)return null;
  try{
    const value=JSON.parse(raw);
    const lat=Number(value.lat);
    const lng=Number(value.lng);
    if(validPoint(lat,lng)){
      return {
        lat,
        lng,
        map_accuracy:
          value.map_accuracy||
          value.accuracy||
          "saved address match"
      };
    }
  }catch(_){}
  return null;
}
function runtimePointKey(c){
  return `la-tennis-runtime-point-v1:${c.id}`;
}
function readSavedCoordinate(c){
  try{
    const runtime=parseCoordinateCache(
      sessionStorage.getItem(
        runtimePointKey(c)
      )
    );
    if(runtime)return runtime;
  }catch(_){}

  for(const key of cacheCandidates(c)){
    try{
      const saved=parseCoordinateCache(
        localStorage.getItem(key)
      );
      if(saved)return saved;
    }catch(_){}
  }
  return null;
}
function hydrateSavedCoordinates(){
  for(const c of COURTS){
    if(hasPoint(c)){
      saveCoordinates(c);
      continue;
    }

    c.lat="";
    c.lng="";
    const saved=readSavedCoordinate(c);
    if(saved){
      c.lat=String(saved.lat);
      c.lng=String(saved.lng);
      c.map_accuracy=saved.map_accuracy;
    }
  }
}
function saveCoordinates(c){
  if(!hasPoint(c))return;
  const payload=JSON.stringify({
    lat:Number(c.lat),
    lng:Number(c.lng),
    map_accuracy:
      c.map_accuracy||
      "saved address match"
  });

  try{
    localStorage.setItem(
      `la-tennis-category-v15:${c.id}`,
      payload
    );
    localStorage.setItem(
      `la-tennis-fast-v1:${c.id}`,
      payload
    );
    localStorage.setItem(
      `geo:${normalizeAddress(c)}`,
      payload
    );
    sessionStorage.setItem(
      runtimePointKey(c),
      payload
    );
  }catch(_){}
}
async function fetchWithTimeout(
  url,
  options={},
  timeout=6000
){
  const controller=new AbortController();
  const timer=setTimeout(
    ()=>controller.abort(),
    timeout
  );
  try{
    return await fetch(
      url,
      {...options,signal:controller.signal}
    );
  }finally{
    clearTimeout(timer);
  }
}
function acceptedGeocodeType(type){
  return new Set([
    "PointAddress",
    "Subaddress",
    "StreetAddress",
    "StreetInt",
    "StreetMidBlock",
    "StreetBetween",
    "POI"
  ]).has(String(type||""));
}
async function requestAddressCandidate(
  c,
  query,
  minimumScore
){
  const url=
    "https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?"+
    new URLSearchParams({
      SingleLine:query,
      sourceCountry:"USA",
      outFields:[
        "Match_addr",
        "Addr_type",
        "City",
        "Region",
        "Postal"
      ].join(","),
      maxLocations:"1",
      forStorage:"false",
      outSR:"4326",
      f:"json"
    });

  const response=await fetchWithTimeout(
    url,
    {mode:"cors"},
    5200
  );
  if(!response.ok){
    throw new Error(
      `Address service returned ${response.status}`
    );
  }

  const data=await response.json();
  const candidate=data?.candidates?.[0];
  const lat=Number(candidate?.location?.y);
  const lng=Number(candidate?.location?.x);
  const score=Number(candidate?.score||0);
  const type=candidate?.attributes?.Addr_type;
  const region=String(
    candidate?.attributes?.Region||""
  ).toUpperCase();

  if(
    !candidate||
    score<minimumScore||
    !validPoint(lat,lng)||
    !acceptedGeocodeType(type)||
    (
      region&&
      region!=="CA"&&
      region!=="CALIFORNIA"
    )
  ){
    return null;
  }

  return {
    lat,
    lng,
    map_accuracy:
      `${type||"address"} match · ${Math.round(score)}%`
  };
}
async function geocodeCourtAddress(c){
  const exact=await requestAddressCandidate(
    c,
    String(c.address||"").trim(),
    76
  ).catch(()=>null);
  if(exact)return exact;

  return await requestAddressCandidate(
    c,
    `${c.name}, ${c.city}, California`,
    88
  ).catch(()=>null);
}
async function ensureCourtPoint(c){
  if(hasPoint(c))return c;

  if(addressMappingInFlight.has(c.id)){
    return addressMappingInFlight.get(c.id);
  }

  const promise=(async ()=>{
    const point=await geocodeCourtAddress(c);
    if(!point)return null;

    c.lat=String(point.lat);
    c.lng=String(point.lng);
    c.map_accuracy=point.map_accuracy;
    saveCoordinates(c);
    return c;
  })().finally(()=>{
    addressMappingInFlight.delete(c.id);
  });

  addressMappingInFlight.set(c.id,promise);
  return promise;
}
async function waitForVisibleDocument(){
  if(!document.hidden)return;
  await new Promise(resolve=>{
    const resume=()=>{
      if(document.hidden)return;
      document.removeEventListener(
        "visibilitychange",
        resume
      );
      resolve();
    };
    document.addEventListener(
      "visibilitychange",
      resume
    );
  });
}
async function startBackgroundMapping(){
  if(mappingRunning)return;
  mappingRunning=true;

  const queue=COURTS.filter(c=>!hasPoint(c));
  mappingTotal=queue.length;
  mappingDone=0;
  mappingFound=0;

  if(!queue.length){
    mappingRunning=false;
    renderAll();
    return;
  }

  let cursor=0;
  const worker=async ()=>{
    while(cursor<queue.length){
      await waitForVisibleDocument();
      const c=queue[cursor++];

      const result=await ensureCourtPoint(c);
      mappingDone++;
      if(result)mappingFound++;

      scheduleRender();
      await new Promise(resolve=>
        setTimeout(resolve,210)
      );
    }
  };

  await Promise.all([
    worker(),
    worker()
  ]);

  mappingRunning=false;
  renderAll();

  const mapped=COURTS.filter(hasPoint).length;
  showToast(
    `${mapped} of ${COURTS.length} facilities are mapped.`
  );
}

    "pay",
    "open",
    "club"
  ]){

    if(
      marker&&
      clusters[c.category]

      clusters[c.category].addLayer(marker);
    }
  }

/* Filtering and list */
function selectedCity(){
  return document.getElementById("city").value;
}
function queryValue(){
  return document.getElementById("search").value.trim().toLowerCase();
}
function filteredCourts(){
  const city=selectedCity();
  const lights=document.getElementById("lights").value;
  const query=queryValue();

  let result=COURTS.filter(c=>{
    if(!enabledCategories.has(c.category))return false;
    if(city&&c.city!==city)return false;
    if(lights&&c.lights!==lights)return false;
    if(query){
      const haystack=[
        c.name,c.city,c.address,c.notes,c.access
      ].join(" ").toLowerCase();
      if(!haystack.includes(query))return false;
    }
    if(
      radiusFilter!==null&&
      userLocation&&
      hasPoint(c)&&
      distanceMiles(
        userLocation,
        {lat:Number(c.lat),lng:Number(c.lng)}
      )>radiusFilter
    )return false;
    if(radiusFilter!==null&&!hasPoint(c))return false;
    return true;
  });

  const sort=document.getElementById("sort").value;
  result.sort((a,b)=>{
    if(sort==="distance"&&userLocation){
      const ad=hasPoint(a)
        ?distanceMiles(userLocation,{lat:Number(a.lat),lng:Number(a.lng)})
        :Infinity;
      const bd=hasPoint(b)
        ?distanceMiles(userLocation,{lat:Number(b.lat),lng:Number(b.lng)})
        :Infinity;
      return ad-bd||a.name.localeCompare(b.name);
    }
    if(sort==="courts"){
      return (Number(b.court_count)||0)-(Number(a.court_count)||0)||
        a.name.localeCompare(b.name);
    }
    return a.name.localeCompare(b.name);
  });
  return result;
}

function facilityPreviewUrl(c){
  if(!hasPoint(c))return "";
  const radiusX=175;

  const point=projectWebMercator(Number(c.lat),Number(c.lng));
  return "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export?"+
    new URLSearchParams({
      bbox:[
        point.x-radiusX,
        point.y-radiusY,
        point.x+radiusX,
        point.y+radiusY
      ].join(","),
      bboxSR:"3857",
      imageSR:"3857",
      size:"1000,570",
      format:"jpg",
      transparent:"false",
      f:"image"
    });
}
function projectWebMercator(lat,lng){
  const radius=6378137;
  const limited=Math.max(-85.05112878,Math.min(85.05112878,lat));
  return {
    x:radius*lng*Math.PI/180,
    y:radius*Math.log(
      Math.tan(Math.PI/4+limited*Math.PI/360)
    )
  };
}

function verifiedLatLng(c){

function focusCourtMarker(c,openDetails=false){
  const latlng=verifiedLatLng(c);
  if(!latlng){
    showToast(
      "This facility still needs a verified map location."
    );
    return false;
  }

  const marker=markerFor(c);
  if(!marker)return false;

  const reveal=()=>{
    if(!openDetails){
      closeDrawer();
      closeMobileSidebar();
    }

    map.invalidateSize({pan:false});

    const targetZoom=
      window.innerWidth<=560
        ?18
        :18.5;

    map.flyTo(
      latlng,
      targetZoom,
      {
        animate:true,
        duration:.55
      }
    );

    window.setTimeout(()=>{
      showMapFocusEffect(c,latlng);

      if(openDetails){
        openDrawer(c);
      }else{
        map.panInside(
          latlng,
          {
            paddingTopLeft:[46,54],
            paddingBottomRight:[46,70],
            animate:true
          }
        );
      }
    },580);
  };

  const group=clusters[c.category];
  if(
    group&&
    typeof group.zoomToShowLayer==="function"
  ){
    group.zoomToShowLayer(
      marker,
      reveal
    );
  }else{
    reveal();
  }

  return true;
}

/* Weather */
function weatherDescription(code){
  const value=Number(code);
  if(value===0)return "Clear";
  if([1,2].includes(value))return "Mostly clear";
  if(value===3)return "Overcast";
  if([45,48].includes(value))return "Fog";
  if(value>=51&&value<=57)return "Drizzle";
  if(value>=61&&value<=67)return "Rain";
  if(value>=71&&value<=77)return "Snow";
  if(value>=80&&value<=82)return "Rain showers";
  if(value>=85&&value<=86)return "Snow showers";
  if(value>=95)return "Thunderstorms";
  return "Mixed conditions";
}
function hourLabel(hour){
  if(hour===0)return "12 AM";
  if(hour===12)return "12 PM";
  return `${hour%12} ${hour<12?"AM":"PM"}`;
}
function dateLabel(dateString,index){
  const date=new Date(`${dateString}T12:00:00`);
  const weekday=new Intl.DateTimeFormat("en-US",{weekday:"short"}).format(date);
  const monthDay=new Intl.DateTimeFormat("en-US",{month:"short",day:"numeric"}).format(date);
  return index===0?`Today · ${monthDay}`:`${weekday} · ${monthDay}`;
}
function formatSunTime(iso){
  if(!iso)return "Unknown";
  const hour=Number(iso.slice(11,13));
  const minute=iso.slice(14,16);
  const label=hourLabel(hour).replace(" ","");
  return `${hour%12||12}:${minute} ${hour<12?"AM":"PM"}`;
}
function weatherScore(point,c){
  let score=100;
  const temp=Number(point.temperature);
  const rain=Number(point.rainChance||0);
  const wind=Number(point.wind||0);
  const gust=Number(point.gust||0);
  const uv=Number(point.uv||0);

  score-=rain*.65;
  if(temp<48)score-=(48-temp)*2.2;
  if(temp>91)score-=(temp-91)*3;
  if(wind>10)score-=(wind-10)*3.5;
  if(gust>18)score-=(gust-18)*2;
  if(uv>8)score-=(uv-8)*3;
  if(!point.isDay&&c.lights!=="yes")score-=28;
  return Math.max(0,Math.min(100,score));
}
function playLabel(score){
  if(score>=82)return "Excellent tennis conditions";
  if(score>=68)return "Good tennis conditions";
  if(score>=52)return "Playable with tradeoffs";
  if(score>=35)return "Marginal tennis conditions";
  return "Poor tennis conditions";
}
function weatherPoint(data,index){
  return {
    time:data.hourly.time[index],
    temperature:data.hourly.temperature_2m[index],
    feels:data.hourly.apparent_temperature[index],
    humidity:data.hourly.relative_humidity_2m[index],
    rainChance:data.hourly.precipitation_probability[index],
    precipitation:data.hourly.precipitation[index],
    code:data.hourly.weather_code[index],
    wind:data.hourly.wind_speed_10m[index],
    gust:data.hourly.wind_gusts_10m[index],
    uv:data.hourly.uv_index[index],
    visibility:data.hourly.visibility[index],
    cloud:data.hourly.cloud_cover[index],
    isDay:Boolean(data.hourly.is_day[index])
  };
}
function populateWeatherControls(data){
  const dateSelect=document.getElementById("weatherDate");
  const timeSelect=document.getElementById("weatherTime");
  if(!dateSelect||!timeSelect)return;

  dateSelect.innerHTML=data.daily.time.map(
    (date,index)=>`<option value="${date}">${esc(dateLabel(date,index))}</option>`
  ).join("");

  const currentDate=String(data.current?.time||"").slice(0,10);
  if(data.daily.time.includes(currentDate)){
    dateSelect.value=currentDate;
  }

  const populateTimes=()=>{
    const date=dateSelect.value;
    const available=data.hourly.time
      .map((time,index)=>({time,index,hour:Number(time.slice(11,13))}))
      .filter(item=>
        item.time.startsWith(date)&&
        item.hour>=5&&
        item.hour<=23
      );
    timeSelect.innerHTML=available.map(item=>
      `<option value="${item.index}">${hourLabel(item.hour)}</option>`
    ).join("");

    if(date===currentDate){
      const currentHour=Number(String(data.current?.time||"").slice(11,13));
      const preferred=available.find(item=>item.hour>=currentHour);
      if(preferred)timeSelect.value=String(preferred.index);
    }else{
      const preferred=available.find(item=>item.hour===17)||
        available.find(item=>item.hour===10)||
        available[0];
      if(preferred)timeSelect.value=String(preferred.index);
    }
    renderWeather(data);
  };

  dateSelect.addEventListener("change",populateTimes);
  timeSelect.addEventListener("change",()=>renderWeather(data));
  populateTimes();
}
function dailyIndexFor(data,date){
  return data.daily.time.indexOf(date);
}
function bestWeatherWindows(data,c){
  const now=Date.now();
  const candidates=[];
  for(let index=0;index<data.hourly.time.length;index++){
    const time=data.hourly.time[index];
    const hour=Number(time.slice(11,13));
    if(hour<6||hour>21)continue;
    const point=weatherPoint(data,index);
    const pseudoDate=new Date(time);
    if(Number.isFinite(pseudoDate.getTime())&&pseudoDate.getTime()<now-60*60*1000)continue;
    const score=weatherScore(point,c);
    if(score<58)continue;
    candidates.push({index,score,time});
  }
  candidates.sort((a,b)=>b.score-a.score);

  const selected=[];
  for(const candidate of candidates){
    const epoch=new Date(candidate.time).getTime();
    if(selected.every(item=>
      Math.abs(epoch-new Date(item.time).getTime())>=2.5*60*60*1000
    )){
      selected.push(candidate);
    }
    if(selected.length>=4)break;
  }
  return selected.sort((a,b)=>a.time.localeCompare(b.time));
}
function renderWeather(data){
  const content=document.getElementById("weatherContent");
  const dateSelect=document.getElementById("weatherDate");
  const timeSelect=document.getElementById("weatherTime");
  if(!content||!dateSelect||!timeSelect||!selectedCourt)return;

  const index=Number(timeSelect.value);
  if(!Number.isFinite(index))return;
  const point=weatherPoint(data,index);
  const score=weatherScore(point,selectedCourt);
  const dayIndex=dailyIndexFor(data,dateSelect.value);
  const high=data.daily.temperature_2m_max[dayIndex];
  const low=data.daily.temperature_2m_min[dayIndex];
  const sunrise=data.daily.sunrise[dayIndex];
  const sunset=data.daily.sunset[dayIndex];
  const dailyRain=data.daily.precipitation_probability_max[dayIndex];
  const best=bestWeatherWindows(data,selectedCourt);

  const visibilityMiles=Number(point.visibility)/1609.344;
  content.innerHTML=`
    <div class="weather-hero">
      <div class="weather-temp">${Math.round(point.temperature)}°</div>
      <div>
        <div class="weather-condition">${esc(weatherDescription(point.code))}</div>
        <div class="weather-play">${esc(playLabel(score))}</div>
      </div>
    </div>

    <div class="weather-metrics">
      <div class="weather-metric"><span>Feels</span><strong>${Math.round(point.feels)}°F</strong></div>
      <div class="weather-metric"><span>Rain chance</span><strong>${Math.round(point.rainChance||0)}%</strong></div>
      <div class="weather-metric"><span>Wind</span><strong>${Math.round(point.wind)} mph</strong></div>
      <div class="weather-metric"><span>Gusts</span><strong>${Math.round(point.gust)} mph</strong></div>
      <div class="weather-metric"><span>Humidity</span><strong>${Math.round(point.humidity)}%</strong></div>
      <div class="weather-metric"><span>UV index</span><strong>${Number(point.uv).toFixed(1)}</strong></div>
      <div class="weather-metric"><span>Cloud cover</span><strong>${Math.round(point.cloud)}%</strong></div>
      <div class="weather-metric"><span>Visibility</span><strong>${visibilityMiles.toFixed(1)} mi</strong></div>
      <div class="weather-metric"><span>Precipitation</span><strong>${Number(point.precipitation).toFixed(2)} in</strong></div>
    </div>

    <div class="day-summary">
      <div><strong>Day range</strong><br>${Math.round(high)}° high · ${Math.round(low)}° low · ${Math.round(dailyRain||0)}% max rain chance</div>
      <div><strong>Daylight</strong><br>Sunrise ${formatSunTime(sunrise)} · Sunset ${formatSunTime(sunset)}</div>
    </div>

    <div class="best-title">Best upcoming windows</div>
    <div class="best-windows">
      ${best.length
        ?best.map(item=>{
          const date=item.time.slice(0,10);
          const day=data.daily.time.indexOf(date);
          const hour=Number(item.time.slice(11,13));
          return `<div class="best-window">${esc(dateLabel(date,day))}<br>${hourLabel(hour)} · ${esc(playLabel(item.score).replace(" tennis conditions",""))}</div>`;
        }).join("")
        :`<div class="best-window">No strong weather window found in the current forecast.</div>`
      }
    </div>
  `;
}
async function loadWeather(c){
  const cached=weatherCache.get(c.id);
  if(cached&&Date.now()-cached.savedAt<WEATHER_CACHE_MS){
    populateWeatherControls(cached.data);
    return;
  }

  const response=await fetch(
    "https://api.open-meteo.com/v1/forecast?"+
    new URLSearchParams({
      latitude:String(c.lat),
      longitude:String(c.lng),
      current:"temperature_2m,weather_code",
      hourly:[
        "temperature_2m",
        "apparent_temperature",
        "relative_humidity_2m",
        "precipitation_probability",
        "precipitation",
        "weather_code",
        "wind_speed_10m",
        "wind_gusts_10m",
        "uv_index",
        "visibility",
        "cloud_cover",
        "is_day"
      ].join(","),
      daily:[
        "sunrise",
        "sunset",
        "temperature_2m_max",
        "temperature_2m_min",
        "precipitation_probability_max",
        "wind_speed_10m_max",
        "uv_index_max"
      ].join(","),
      temperature_unit:"fahrenheit",
      wind_speed_unit:"mph",
      precipitation_unit:"inch",
      forecast_days:"7",
      timezone:"auto"
    }),
    {mode:"cors"}
  ).catch(()=>null);

  if(!response?.ok){
    const content=document.getElementById("weatherContent");
    if(content)content.innerHTML=
      `<div class="info-value" style="padding:16px 2px">Forecast is temporarily unavailable.</div>`;
    return;
  }

  const data=await response.json();
  weatherCache.set(c.id,{savedAt:Date.now(),data});
  if(selectedCourt?.id===c.id){
    populateWeatherControls(data);
  }
}

/* Location and controls */
function populateCities(){
  const cities=[
    ...new Set(
      COURTS.map(c=>c.city).filter(Boolean)
    )
  ].sort((a,b)=>a.localeCompare(b));

  const options=
    '<option value="">All areas</option>'+
    cities.map(city=>
      `<option value="${esc(city)}">${esc(city)}</option>`
    ).join("");

  document.getElementById("city").innerHTML=options;
  document.getElementById("cityMobile").innerHTML=options;
}

function getLocation(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject(new Error("Geolocation unavailable"));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      position=>resolve({
        lat:position.coords.latitude,
        lng:position.coords.longitude
      }),
      reject,
      {enableHighAccuracy:true,timeout:9000,maximumAge:120000}
    );
  });
}
async function locateMe(){
  const button=document.getElementById("locate");
  const original=button.textContent;
  button.disabled=true;
  button.textContent="Locating...";
  try{
    userLocation=await getLocation();
    radiusFilter=null;
    document.getElementById("sort").value="distance";
    renderAll();
    map.setView([userLocation.lat,userLocation.lng],12);
  }catch(_){
    showToast("Your location could not be retrieved.");
  }finally{
    button.disabled=false;
    button.textContent=original;
  }
}
async function findNearby(){
  const button=document.getElementById("nearby");
  const original=button.textContent;
  button.disabled=true;
  button.textContent="Locating...";
  try{
    if(!userLocation)userLocation=await getLocation();
    radiusFilter=Number(document.getElementById("radius").value)||5;
    document.getElementById("sort").value="distance";
    renderAll();

    const points=filteredCourts()
      .filter(hasPoint)
      .map(c=>[Number(c.lat),Number(c.lng)]);
    if(points.length){
      map.fitBounds(points,{padding:[35,35],maxZoom:13});
    }
    closeMobileSidebar();
  }catch(_){
    showToast("Your location could not be retrieved.");
  }finally{
    button.disabled=false;
    button.textContent=original;
  }
}
function isMobileLayout(){
  return window.matchMedia(
    "(max-width:900px)"
  ).matches;
}
function setMobileSidebar(open){
  const sidebar=document.getElementById("sidebar");
  const backdrop=document.getElementById("mobileBackdrop");
  const menu=document.getElementById("mobileMenu");

  sidebar.classList.toggle("open",open);
  backdrop.hidden=!open;
  menu.setAttribute(
    "aria-expanded",
    String(open)
  );
  document.body.classList.toggle(
    "mobile-sheet-open",
    open
  );

  if(open){
    window.setTimeout(()=>{
      document.getElementById("search")?.focus({
        preventScroll:true
      });
    },220);
  }
}
function closeMobileSidebar(){
  if(isMobileLayout()){
    setMobileSidebar(false);
  }
}
function syncCitySelects(source){
  const city=document.getElementById("city");
  const mobile=document.getElementById("cityMobile");
  const value=source.value;

  if(city.value!==value)city.value=value;
  if(mobile.value!==value)mobile.value=value;
}
function wireControls(){
  document.getElementById("search").addEventListener("input",renderAll);
  document.getElementById("city").addEventListener("change",event=>{
    syncCitySelects(event.target);
    renderAll();
  });
  document.getElementById("cityMobile").addEventListener("change",event=>{
    syncCitySelects(event.target);
    renderAll();
  });
  document.getElementById("lights").addEventListener("change",renderAll);
  document.getElementById("sort").addEventListener("change",renderAll);
  document.getElementById("locate").addEventListener("click",locateMe);
  document.getElementById("nearby").addEventListener("click",findNearby);
  document.getElementById("radius").addEventListener("change",()=>{
    if(radiusFilter!==null)findNearby();
  });
  document.getElementById("drawerClose").addEventListener("click",closeDrawer);
  document.getElementById("mobileMenu").addEventListener("click",()=>{
    const open=!document.getElementById("sidebar").classList.contains("open");
    setMobileSidebar(open);
  });
  document.getElementById("mobileSidebarClose").addEventListener(
    "click",
    ()=>setMobileSidebar(false)
  );
  document.getElementById("mobileBackdrop").addEventListener(
    "click",
    ()=>setMobileSidebar(false)
  );
  document.querySelectorAll(".category-toggle").forEach(button=>{
    button.addEventListener("click",()=>{
      const category=button.dataset.category;
      if(enabledCategories.has(category)){
        enabledCategories.delete(category);
      }else{
        enabledCategories.add(category);
      }
      button.setAttribute(
        "aria-pressed",
        String(enabledCategories.has(category))
      );
      renderAll();
    });
  });
  window.addEventListener("resize",()=>{
    if(!isMobileLayout()){
      setMobileSidebar(false);
    }
    if(selectedCourt){
      setTimeout(()=>map.invalidateSize({pan:false}),80);
    }
  });

  document.addEventListener("keydown",event=>{
    if(event.key!=="Escape")return;

    if(
      !document.getElementById("drawer").hidden
    ){
      closeDrawer();
      return;
    }

    if(
      document.getElementById("sidebar").classList.contains("open")
    ){
      setMobileSidebar(false);
    }
  });
}

function clearBrokenBuild14Cache(){
  try{
    for(
      let index=localStorage.length-1;
      index>=0;
      index--
    ){
      const key=localStorage.key(index);
      if(
        key&&
        (
          key.startsWith(
            "la-tennis-coordinate-v14:"
          )||
          key==="la-tennis-coordinate-v14-cleaned"
        )
      ){
        localStorage.removeItem(key);
      }
    }
  }catch(_){}
}
async function init(){
  clearBrokenBuild14Cache();
  hydrateSavedCoordinates();
  populateCities();
  syncCitySelects(
    document.getElementById("city")
  );
  createMap();
  wireControls();
  renderAll();

  startBackgroundMapping();
  runLaunch();
}

if(document.readyState==="loading"){
  document.addEventListener("DOMContentLoaded",init);
}else{
  init();
}
</script>
